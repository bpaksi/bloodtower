# Full Playwright e2e suite on pushes to main. Not a required check: the gate is the `e2e`
# job in check.yml, which runs the same steps on the pull request. This run is the record
# on main. A push that only touches paths the Bloodtower build never reads is skipped: the
# trees in E2E_SAFE_TREES and the app's own plans, notes and markdown (`bloodtowerDocs`), both
# in scripts/ci-scope.mjs.
# The suite runs as four parallel shards (`--shard=N/4`), as in check.yml.
# Setup mirrors check.yml (pnpm, .nvmrc node, bluetooth headers, frozen install).
name: e2e-main

on:
  push:
    branches: [main]
    paths-ignore:
      - "research/**"
      - "docs/**"
      - "assets/stories/**"
      - "assets/app-icon/**"
      - ".claude/**"
      - ".agents/**"
      - "apps/bloodtower/plans/**"
      - "apps/bloodtower/docs/**"
      - "apps/bloodtower/**/*.md"
  workflow_dispatch:

concurrency:
  group: e2e-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One shard failing must not hide the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: pnpm setup
        uses: pnpm/action-setup@v4
      - name: node setup
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Bluetooth headers for the native tower library; nothing in CI connects to a tower.
      # Drop the unused packages.microsoft.com APT source first so transient 403s do not break apt-get update or playwright --with-deps.
      - name: bluetooth and udev headers
        run: |
          for f in /etc/apt/sources.list.d/*; do
            if [ -f "$f" ] && grep -q 'packages\.microsoft\.com' "$f"; then
              sudo rm -f "$f"
            fi
          done
          sudo apt-get update && sudo apt-get install -y libbluetooth-dev libudev-dev
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      # The browser downloads are cached per Playwright version. `--with-deps` still installs the
      # system packages on a cache hit; only the download is skipped.
      - name: playwright version
        id: playwright
        run: echo "version=$(pnpm -F bloodtower-e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      - name: playwright browsers
        run: pnpm -F bloodtower-e2e exec playwright install --with-deps chromium webkit
      # The same build the e2e webServer would run (pack lint, then next build). Done once
      # here; E2E_PREBUILT=1 tells the webServer not to build it again.
      - name: build
        run: pnpm --dir apps/bloodtower build
      - name: playwright e2e (shard ${{ matrix.shard }}/4)
        env:
          E2E_PREBUILT: "1"
          # `--shard` cuts the listed tests into contiguous slices; these weights set each slice's
          # share of the count. Equal slices put the slow iPad c3-* specs in one shard. Set from
          # the per-test times of CI run 45176529788 so each shard has about 660 s of tests.
          # Retune when one shard runs much longer than the others (see playwright.config.ts).
          PWTEST_SHARD_WEIGHTS: "97:57:89:100"
        run: pnpm --dir apps/bloodtower e2e --shard=${{ matrix.shard }}/4
      - name: upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/bloodtower/src/e2e/playwright-report
            apps/bloodtower/src/e2e/test-results
          retention-days: 7
