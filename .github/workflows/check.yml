# Branch protection on main requires the job named `check`. It is the last job here and
# always runs and reports: it passes only when `scope` passed and `suite` and `e2e` each
# passed or were not needed. A path filter on `on:` would skip the workflow entirely, and
# the required check would never report.
#
# Gitleaks always runs (job `scope`). It fails the workflow when the pull request's commits,
# or the commits in a push to main, contain a secret. It does not audit the repository's
# full history (no schedule and no workflow_dispatch). fetch-depth 0 only makes that
# commit range available locally.
#
# What runs is decided by scripts/ci-scope.mjs from the changed paths:
#
#   Full CI     any path outside the lite allowlist: `pnpm check`.
#   Lite CI     (Bob / Warden, 2026-10-25/26) every changed path is on the allowlist:
#                 research/game-design/**   runs `pnpm check:cards` (the card lint)
#                 packs/**                  runs `pnpm check:packs` (pack lint, pack-reading tests)
#                 docs/**                   (ui-mocks, art-direction, deliveries, this tree)
#                 assets/stories/**         (story scripts)
#                 assets/app-icon/**        (icon images)
#               A lite change skips Biome, typecheck and the rest of `pnpm check`. The card
#               and pack checks were added on 2026-11-11 after PR #420, a lite change, merged
#               with a broken card link and a stale pack count and turned main red.
#   e2e         pull requests only: the Playwright suite, when a changed path can reach the
#               Bloodtower build (apps/bloodtower, packages, packs, root config, workflows).
#               Pushes to main run it from e2e-main.yml.
#
# Anything under apps/, including app docs and app asset folders, is full CI. A range that
# cannot be diffed runs everything.
name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks-action lists the pull request's commits. Comments stay off (see the step).
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needs_full_ci: ${{ steps.scope.outputs.needs_full_ci }}
      needs_cards: ${{ steps.scope.outputs.needs_cards }}
      needs_packs: ${{ steps.scope.outputs.needs_packs }}
      needs_e2e: ${{ steps.scope.outputs.needs_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: classify changes
        id: scope
        env:
          CI_SCOPE_EVENT: ${{ github.event_name }}
          CI_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_SCOPE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          base="${CI_SCOPE_BASE}"
          head="${CI_SCOPE_HEAD}"
          zero="0000000000000000000000000000000000000000"
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"

          report() {
            echo "CI scope: $1"
            {
              echo "## CI scope"
              echo
              echo "$1"
            } >> "$summary"
          }

          # Unknown range: run everything. A missing base (first push, force-push whose
          # previous tip was not fetched) must not look like a docs-only change.
          run_everything() {
            {
              echo "needs_full_ci=true"
              echo "needs_cards=false"
              echo "needs_packs=false"
              echo "needs_e2e=true"
            } >> "$GITHUB_OUTPUT"
            report "$1 Runs: pnpm check, the e2e suite."
            exit 0
          }

          if [ -z "$base" ] || [ "$base" = "$zero" ]; then
            echo "::warning::No base commit to diff (base=${base:-empty})."
            run_everything "No base commit to diff against."
          fi
          if ! git cat-file -e "${base}^{commit}" >/dev/null 2>&1; then
            echo "::warning::Base commit ${base} is not in this checkout."
            run_everything "The base commit is not in this checkout."
          fi
          if ! git cat-file -e "${head}^{commit}" >/dev/null 2>&1; then
            echo "::warning::Head commit ${head} is not in this checkout."
            run_everything "The head commit is not in this checkout."
          fi

          if [ "$CI_SCOPE_EVENT" = "pull_request" ]; then
            # Three-dot: files this PR introduces since the merge base, not files
            # that landed on main after the branch point.
            if ! files="$(git diff --name-only --no-renames "${base}...${head}")"; then
              echo "::warning::git diff failed for ${base}...${head}."
              run_everything "The pull request diff could not be listed."
            fi
          else
            # Push to main. Net tree diff plus every commit in the range, so a
            # code file that a later commit reverts still counts as a non-lite path.
            if ! files="$(
              set -euo pipefail
              git diff --name-only --no-renames "${base}" "${head}"
              commits="$(git rev-list "${base}..${head}")"
              while IFS= read -r commit; do
                [ -z "$commit" ] && continue
                if git rev-parse --verify --quiet "${commit}^1" >/dev/null; then
                  git diff --name-only --no-renames "${commit}^1" "$commit"
                else
                  git diff-tree --no-commit-id --name-only -r --no-renames "$commit"
                fi
              done <<< "$commits"
            )"; then
              echo "::warning::git diff failed for push ${base}..${head}."
              run_everything "The push diff could not be listed."
            fi
          fi

          # The runner image ships Node; the classifier has no dependencies.
          if ! scope="$(printf '%s\n' "$files" | node scripts/ci-scope.mjs)"; then
            echo "::warning::scripts/ci-scope.mjs failed."
            run_everything "The changed paths could not be classified."
          fi

          printf '%s\n' "$scope" | grep -E '^needs_[a-z0-9_]+=(true|false)$' >> "$GITHUB_OUTPUT"
          report "$(printf '%s\n' "$scope" | sed -n 's/^detail=//p')"
      - name: gitleaks
        # v3.0.0. GITLEAKS_VERSION matches scripts/gitleaks-protect.mjs (default rules).
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  suite:
    needs: scope
    if: >-
      needs.scope.outputs.needs_full_ci == 'true' ||
      needs.scope.outputs.needs_cards == 'true' ||
      needs.scope.outputs.needs_packs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: pnpm setup
        uses: pnpm/action-setup@v4
      - name: node setup
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Bluetooth headers for the native tower library; nothing in CI connects to a tower.
      - name: bluetooth and udev headers
        run: sudo apt-get update && sudo apt-get install -y libbluetooth-dev libudev-dev
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm check
        if: needs.scope.outputs.needs_full_ci == 'true'
        run: pnpm check
      - name: card lint
        if: needs.scope.outputs.needs_cards == 'true'
        run: pnpm check:cards
      - name: pack checks
        if: needs.scope.outputs.needs_packs == 'true'
        run: pnpm check:packs

  # Same steps as e2e-main.yml, which runs the suite on pushes to main.
  e2e:
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.needs_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: pnpm setup
        uses: pnpm/action-setup@v4
      - name: node setup
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Bluetooth headers for the native tower library; nothing in CI connects to a tower.
      - name: bluetooth and udev headers
        run: sudo apt-get update && sudo apt-get install -y libbluetooth-dev libudev-dev
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: playwright browsers
        run: pnpm -F bloodtower-e2e exec playwright install --with-deps chromium
      - name: build web export
        run: pnpm --dir apps/bloodtower/src/web build
      - name: playwright e2e
        run: pnpm --dir apps/bloodtower e2e
      - name: upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/bloodtower/src/e2e/playwright-report
            apps/bloodtower/src/e2e/test-results
          retention-days: 7

  # The required status. `always()` matters: a skipped job counts as a pass for branch
  # protection, so this job must run and fail when an earlier job failed or was cancelled.
  check:
    needs: [scope, suite, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: gate
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SUITE_RESULT: ${{ needs.suite.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "scope=${SCOPE_RESULT} suite=${SUITE_RESULT} e2e=${E2E_RESULT}"
          ok=true
          # `suite` and `e2e` are skipped when scope says they are not needed. They are
          # also skipped when scope failed, which the first test catches.
          [ "$SCOPE_RESULT" = "success" ] || ok=false
          case "$SUITE_RESULT" in success | skipped) ;; *) ok=false ;; esac
          case "$E2E_RESULT" in success | skipped) ;; *) ok=false ;; esac
          if [ "$ok" != true ]; then
            echo "::error::check failed: scope=${SCOPE_RESULT} suite=${SUITE_RESULT} e2e=${E2E_RESULT}"
            exit 1
          fi
