# Every website lives in apps/<name>/. An app can be a single package
# (apps/<name>/package.json) or several parts (apps/<name>/src/<part>/package.json).
# Shared code moves to packages/ once more than one app needs it.
packages:
  - "apps/*"
  - "apps/*/src/*"
  - "packages/*"
# Dependencies allowed to run install scripts (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - lefthook
# @types/better-sqlite3 asks for any @types/node and would take the newest in the workspace
# (Visuals pins 26.x). The tower service is typed against Node 22, so hold that edge to its pin.
overrides:
  "@types/better-sqlite3>@types/node": "22.20.5"
