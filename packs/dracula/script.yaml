# Dracula pack: talking-avatar script (story-pack-format 2.1).
# Generated from assets/stories/dracula/scripts/*.md. Line ids are stable: never renumber; retire, do not reuse.
# target is added for private moments (ipad:<hunter>); untagged moments play on storyboard.

- id: "n1-burgomasters-house.01"
  source: n1-burgomasters-house.md
  lines:
    - {id: "n1-burgomasters-house.01.vo-01", speaker: narrator, text: "Anton Morosz kept the valley's ledgers for thirty years. He found his daughter at the church door as a baby, wrapped in a shawl no one in Vellmoor had ever woven."}
    - {id: "n1-burgomasters-house.01.vo-02", speaker: narrator, text: "Last night he stood at her door with a poker, and this morning the maid found him on the stair, white and still. The girl was gone."}
- id: "n1-burgomasters-house.02"
  source: n1-burgomasters-house.md
  lines:
    - {id: "n1-burgomasters-house.02.vo-01", speaker: agnes, note: "kneeling by the body", text: "He fought. There's skin under his nails, and it is cold."}
    - {id: "n1-burgomasters-house.02.vo-02", speaker: tomas, text: "Anton never fought anyone in his life. He fined me twice and was right both times."}
- id: "n1-burgomasters-house.03"
  source: n1-burgomasters-house.md
  lines:
    - {id: "n1-burgomasters-house.03.vo-01", speaker: narrator, text: "Wren goes up the stairs without asking. The girl's room smells of dried violets. The window is open on the castle."}
    - {id: "n1-burgomasters-house.03.vo-02", speaker: wren, text: "Latch is scratched. From outside. She didn't go out. Something came in and carried her."}
- id: "n1-burgomasters-house.04"
  source: n1-burgomasters-house.md
  lines:
    - {id: "n1-burgomasters-house.04.vo-01", speaker: emeric, text: "Her diary. Last entry: \"Every morning the window is open, and I've been dreaming of a garden I've never seen.\" Her name was Lenka. Is Lenka."}
    - {id: "n1-burgomasters-house.04.vo-02", speaker: agnes, text: "Is. Keep saying is."}
- id: "n1-burgomasters-house.05"
  source: n1-burgomasters-house.md
  lines:
    - {id: "n1-burgomasters-house.05.vo-01", speaker: narrator, text: "On the dresser lies a letter on heavy cream paper, unsigned. The hand is beautiful and very old."}
    - {id: "n1-burgomasters-house.05.vo-02", speaker: emeric, note: "reading", text: "\"You have been away so long. Come home.\" He wrote to her. Before he came."}
- id: "n1-burgomasters-house.06"
  source: n1-burgomasters-house.md
  lines:
    - {id: "n1-burgomasters-house.06.vo-01", speaker: narrator, text: "The maid saw the end from the kitchen door. She tells it to the floor, not to you."}
    - {id: "n1-burgomasters-house.06.vo-02", speaker: anton, note: "remembered", text: "You will not have her. Not while I'm in this house. Lenka, run..."}
- id: "n1-burgomasters-house.07"
  source: n1-burgomasters-house.md
  lines:
    - {id: "n1-burgomasters-house.07.vo-01", speaker: tomas, text: "He took her up the hill. I know that road. I know that gate."}
    - {id: "n1-burgomasters-house.07.vo-02", speaker: agnes, note: "thumb on her scar", text: "Then we bring her down it."}
- id: "n1-burgomasters-house.08"
  source: n1-burgomasters-house.md
  lines:
    - {id: "n1-burgomasters-house.08.vo-01", speaker: narrator, text: "On the sill, a single pressed mountain violet, laid there deliberately. Mountain violets do not grow in the valley."}
    - {id: "n1-burgomasters-house.08.vo-02", speaker: wren, text: "She left that. For whoever came after her."}
- id: "n1-burgomasters-house.10"
  source: n1-burgomasters-house.md
  lines:
    - {id: "n1-burgomasters-house.10.vo-01", speaker: narrator, text: "Below the window, in the mud, the print of a single bare foot, pointing up the hill. And beside it, smaller, the mark of a girl's heel, dragged."}
- id: "n1-fortune-reading.01"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.01.vo-01", speaker: narrator, text: "Old Vadoma's people came into the valley before the mist and could not leave after it. She has read the cards for every burgomaster of Vellmoor. She has been expecting you since spring."}
- id: "n1-fortune-reading.02"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.02.vo-01", speaker: vadoma, text: "Sit, all of you. You brought me something of hers. Give it here."}
    - {id: "n1-fortune-reading.02.vo-02", speaker: agnes, text: "Her pressed violet. Father Oskar said you read true."}
    - {id: "n1-fortune-reading.02.vo-03", speaker: vadoma, text: "Oskar said many things. He was right about that one."}
- id: "n1-fortune-reading.03~village"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.03~village.vo-01", speaker: vadoma, text: "A sword that was a brother's. It still remembers the sun. It waits under a house that burned and was not rebuilt."}
- id: "n1-fortune-reading.03~sanctuary"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.03~sanctuary.vo-01", speaker: vadoma, text: "A sword that was a brother's. It still remembers the sun. It waits where the smiths' dead are kept."}
- id: "n1-fortune-reading.03~bazaar"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.03~bazaar.vo-01", speaker: vadoma, text: "A sword that was a brother's. It still remembers the sun. It waits on the smith's own anvil, cold forty years."}
- id: "n1-fortune-reading.03~citadel"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.03~citadel.vo-01", speaker: vadoma, text: "A sword that was a brother's. It still remembers the sun. It waits in the old guard's armoury, behind the door that squeaks."}
- id: "n1-fortune-reading.04~village"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.04~village.vo-01", speaker: vadoma, text: "A saint's light, carried out of a burning house and lost under the dead. It sleeps beneath the well, where the plague dead were laid."}
- id: "n1-fortune-reading.04~sanctuary"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.04~sanctuary.vo-01", speaker: vadoma, text: "A saint's light, carried out of a burning house and lost under the dead. It sleeps in the crypt beneath the altar."}
- id: "n1-fortune-reading.04~bazaar"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.04~bazaar.vo-01", speaker: vadoma, text: "A saint's light, carried out of a burning house and lost under the dead. It sleeps in a reliquary sold and never paid for."}
- id: "n1-fortune-reading.04~citadel"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.04~citadel.vo-01", speaker: vadoma, text: "A saint's light, carried out of a burning house and lost under the dead. It sleeps in the lord's chapel, in the floor."}
- id: "n1-fortune-reading.05"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.05.vo-01", speaker: agnes, note: "very still", text: "Which saint, old mother?"}
    - {id: "n1-fortune-reading.05.vo-02", speaker: vadoma, text: "You know which, Sister. You have her burn on your palm."}
- id: "n1-fortune-reading.06~village"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.06~village.vo-01", speaker: vadoma, text: "His own book. In it, the truth of the girl he took. Last of all, in the archive that burned. Do not read it before you hold the other two."}
- id: "n1-fortune-reading.06~sanctuary"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.06~sanctuary.vo-01", speaker: vadoma, text: "His own book. In it, the truth of the girl he took. Last of all, chained in the abbey library. Do not read it before you hold the other two."}
- id: "n1-fortune-reading.06~bazaar"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.06~bazaar.vo-01", speaker: vadoma, text: "His own book. In it, the truth of the girl he took. Last of all, among stolen goods, unopened. Do not read it before you hold the other two."}
- id: "n1-fortune-reading.06~citadel"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.06~citadel.vo-01", speaker: vadoma, text: "His own book. In it, the truth of the girl he took. Last of all, in the lord's study, in the desk he never sat at. Do not read it before you hold the other two."}
- id: "n1-fortune-reading.07"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.07.vo-01", speaker: vadoma, text: "And he waits for you at the top, in the room I have laid face up. That card I wish I had not turned."}
- id: "n1-fortune-reading.08~obj1"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.08~obj1.vo-01", speaker: vadoma, text: "He wants her to open the last window herself."}
- id: "n1-fortune-reading.08~obj2"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.08~obj2.vo-01", speaker: vadoma, text: "He wants a seat at your table. Count the chairs."}
- id: "n1-fortune-reading.08~obj3"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.08~obj3.vo-01", speaker: vadoma, text: "He wants a brother's grief buried again."}
- id: "n1-fortune-reading.08~obj4"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.08~obj4.vo-01", speaker: vadoma, text: "He wants the whole valley on its knees."}
- id: "n1-fortune-reading.09"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.09.vo-01", speaker: agnes, text: "And the girl? Is she alive?"}
    - {id: "n1-fortune-reading.09.vo-02", speaker: vadoma, note: "turning the violet over", text: "Alive, and saying no. Two lives in this flower, Sister. One is hers. I cannot tell you whose the other is. Only the book can."}
- id: "n1-fortune-reading.10"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.10.vo-01", speaker: emeric, text: "Two lives... is that a metaphor? Please tell me that's a metaphor."}
    - {id: "n1-fortune-reading.10.vo-02", speaker: vadoma, text: "Everything is a metaphor, little scholar, until it bites you."}
- id: "n1-fortune-reading.12"
  source: n1-fortune-reading.md
  lines:
    - {id: "n1-fortune-reading.12.vo-01", speaker: narrator, text: "The sun comes up grey and does not warm anything. Five nights. No more will be given."}
- id: "n1-lantern-and-bell.01"
  source: n1-lantern-and-bell.md
  lines:
    - {id: "n1-lantern-and-bell.01.vo-01", speaker: narrator, text: "Vellmoor has buried more of its own this year than in the ten before it. Tonight is All Hallows' Eve, and the castle on the hill is lit for the first time in a generation."}
- id: "n1-lantern-and-bell.02"
  source: n1-lantern-and-bell.md
  lines:
    - {id: "n1-lantern-and-bell.02.vo-01", speaker: hanne, text: "Varga. I'd heard you were dead."}
    - {id: "n1-lantern-and-bell.02.vo-02", speaker: tomas, note: "taps the axe haft three times", text: "Not for lack of trying, lass."}
- id: "n1-lantern-and-bell.03"
  source: n1-lantern-and-bell.md
  lines:
    - {id: "n1-lantern-and-bell.03.vo-01", speaker: agnes, text: "You keep a fire burning all night, innkeeper. What are you afraid of?"}
    - {id: "n1-lantern-and-bell.03.vo-02", speaker: hanne, text: "Same as you, Sister, or you wouldn't have asked."}
- id: "n1-lantern-and-bell.04"
  source: n1-lantern-and-bell.md
  lines:
    - {id: "n1-lantern-and-bell.04.vo-01", speaker: emeric, text: "I'm looking for Father Oskar? I have a letter. That is, he sent me a letter. That is, I'm expected. I think."}
    - {id: "n1-lantern-and-bell.04.vo-02", speaker: tomas, note: "laying a black-sealed letter on the table", text: "So am I, lad."}
- id: "n1-lantern-and-bell.05"
  source: n1-lantern-and-bell.md
  lines:
    - {id: "n1-lantern-and-bell.05.vo-01", speaker: narrator, text: "Agnes lays down a third letter. Then the door opens on a woman muddy to the knees, who smells the room and drops a fourth."}
    - {id: "n1-lantern-and-bell.05.vo-02", speaker: wren, text: "Father Oskar's not coming. They buried him this morning."}
    - {id: "n1-lantern-and-bell.05.vo-03", speaker: emeric, text: "Then who's... then he wrote these from..."}
    - {id: "n1-lantern-and-bell.05.vo-04", speaker: wren, text: "Before. Grave's open now. From the inside."}
- id: "n1-lantern-and-bell.06"
  source: n1-lantern-and-bell.md
  lines:
    - {id: "n1-lantern-and-bell.06.vo-01", speaker: emeric, text: "He split it between us so no single one of us could... oh. That's very clever."}
    - {id: "n1-lantern-and-bell.06.vo-02", speaker: tomas, text: "It's a riddle that got a priest killed."}
- id: "n1-lantern-and-bell.07"
  source: n1-lantern-and-bell.md
  lines:
    - {id: "n1-lantern-and-bell.07.vo-01", speaker: narrator, text: "A stable boy stumbles in, white to the lips. The road out of the valley is gone. Not blocked. Gone. The mist has come down over it like a lid."}
    - {id: "n1-lantern-and-bell.07.vo-02", speaker: hanne, text: "It does that when he wants company. Nobody leaves Vellmoor now, loves. Not since spring."}
- id: "n1-lantern-and-bell.08"
  source: n1-lantern-and-bell.md
  lines:
    - {id: "n1-lantern-and-bell.08.vo-01", speaker: hanne, text: "You want to help this valley? Go up the hill to the burgomaster's house. Anton Morosz died last night, at his daughter's door. And the girl is gone."}
    - {id: "n1-lantern-and-bell.08.vo-02", speaker: agnes, text: "Gone where, innkeeper?"}
- id: "n1-lantern-and-bell.09"
  source: n1-lantern-and-bell.md
  lines:
    - {id: "n1-lantern-and-bell.09.vo-01", speaker: hanne, text: "Up. Every night for a month her window was open in the morning, and she always shut it. This morning it was open, and her bed was empty."}
- id: "n1-lantern-and-bell.11"
  source: n1-lantern-and-bell.md
  lines:
    - {id: "n1-lantern-and-bell.11.vo-01", speaker: narrator, text: "The mist is at the windows now. The hunt begins."}
- id: "n1-open-grave.01"
  source: n1-open-grave.md
  lines:
    - {id: "n1-open-grave.01.vo-01", speaker: narrator, text: "The soil around Father Oskar's grave is heaped outward, in a ring. Whatever left the coffin did not need a spade."}
- id: "n1-open-grave.02"
  source: n1-open-grave.md
  lines:
    - {id: "n1-open-grave.02.vo-01", speaker: wren, text: "Dug from the inside. Fingers, not claws. He was a tidy man. Look, he folded the shroud."}
    - {id: "n1-open-grave.02.vo-02", speaker: emeric, text: "That's the most horrible thing I've ever heard."}
- id: "n1-open-grave.03"
  source: n1-open-grave.md
  lines:
    - {id: "n1-open-grave.03.vo-01", speaker: emeric, text: "A map. Three parishes marked with a bell, the fourth blotted out. And a note: \"The fortune-woman reads true. Take her something of the girl's.\""}
    - {id: "n1-open-grave.03.vo-02", speaker: agnes, text: "Then we take her at dawn. If we live to it."}
- id: "n1-open-grave.04"
  source: n1-open-grave.md
  lines:
    - {id: "n1-open-grave.04.vo-01", speaker: narrator, text: "Someone is standing in the next row of graves, in a priest's cassock gone black with earth."}
    - {id: "n1-open-grave.04.vo-02", speaker: oskar, text: "You came. All four. I asked so many, and you are the ones who came."}
- id: "n1-open-grave.05"
  source: n1-open-grave.md
  lines:
    - {id: "n1-open-grave.05.vo-01", speaker: agnes, text: "Father Oskar. Step into the lantern light."}
    - {id: "n1-open-grave.05.vo-02", speaker: oskar, text: "I can't, Sister. He says the light is not for me."}
    - {id: "n1-open-grave.05.vo-03", speaker: oskar, note: "source: Stoker; softly", text: "\"The blood is the life.\" I used to read that as scripture. It isn't."}
- id: "n1-open-grave.06"
  source: n1-open-grave.md
  lines:
    - {id: "n1-open-grave.06.vo-01", speaker: oskar, text: "He has little Lenka. He'll call her by another name up there. Tell her not to answer to it."}
    - {id: "n1-open-grave.06.vo-02", speaker: wren, text: "What name? Oskar. What name?"}
- id: "n1-open-grave.map-shared"
  source: n1-open-grave.md
  lines:
    - {id: "n1-open-grave.map-shared.vo-01", speaker: agnes, text: "The ink hides the high meadow. He signed my ledger from there."}
    - {id: "n1-open-grave.map-shared.vo-02", speaker: wren, text: "Violets grow up there. Nowhere else. It's where she comes from. And him."}
- id: "n1-open-grave.07"
  source: n1-open-grave.md
  lines:
    - {id: "n1-open-grave.07.vo-01", speaker: narrator, text: "The priest's gentle face splits into hunger, and he comes for the living."}
- id: "n1-open-grave.08"
  source: n1-open-grave.md
  lines:
    - {id: "n1-open-grave.08.vo-01", speaker: wren, note: "scratching a bolt", text: "O-S-K-A-R. He'd want it spelled right."}
    - {id: "n1-open-grave.08.vo-02", speaker: agnes, text: "He'd want us to pray. You carve; I'll pray. It comes to the same."}
- id: "n1-open-grave.09"
  source: n1-open-grave.md
  lines:
    - {id: "n1-open-grave.09.vo-01", speaker: narrator, text: "Somewhere in the village, the bell begins to count toward midnight, and nobody is pulling the rope."}
- id: "n1-open-grave.08~fight-lost"
  source: n1-open-grave.md
  lines:
    - {id: "n1-open-grave.08~fight-lost.vo-01", speaker: narrator, text: "Oskar drags himself back into his grave, sated, and the hunters' lanterns are all out."}
    - {id: "n1-open-grave.08~fight-lost.vo-02", speaker: agnes, text: "We failed him twice now. Not a third time."}
- id: "n2-burgomasters-funeral.01"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.01.vo-01", speaker: narrator, text: "Vellmoor buries its burgomaster without a priest and without his daughter. Hanne reads the words, badly, from Oskar's book. Beside Anton lies Dorka Halasz, nineteen, in her wedding dress, because her mother said she'd waited long enough to wear it."}
- id: "n2-burgomasters-funeral.02"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.02.vo-01", speaker: agnes, text: "She ran after Lenka, up the hill, in the dark. Alone."}
    - {id: "n2-burgomasters-funeral.02.vo-02", speaker: wren, text: "Braver than the rest of this valley. Lid's not nailed."}
- id: "n2-burgomasters-funeral.03"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.03.vo-01", speaker: emeric, text: "It's a wake. You don't nail it at a... oh. Oh, you nail it at a wake here."}
- id: "n2-burgomasters-funeral.investigate"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.investigate.vo-01", speaker: narrator, text: "The mourners keep their vigil. You have one candle's length, no more, before something in this church happens. Use it."}
- id: "n2-burgomasters-funeral.investigate.share"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.investigate.share.vo-01", speaker: narrator, text: "The candle is out. Share what you found, or keep it. Then look at the second coffin."}
- id: "n2-burgomasters-funeral.lid-choice"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.lid-choice.vo-01", speaker: narrator, text: "The flies have gone quiet. Every candle leans toward the second coffin. There is time, just, to put a stake through a girl in her wedding dress in front of her mother. Or there is time to wait and be sure."}
- id: "n2-burgomasters-funeral.lid-choice~nailed"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.lid-choice~nailed.vo-01", speaker: wren, text: "Sorry, Dorka."}
    - {id: "n2-burgomasters-funeral.lid-choice~nailed.vo-02", speaker: narrator, text: "The hammer is very loud in the little church. The stake goes in crooked. Her mother does not scream; she just stops breathing for a while."}
- id: "n2-burgomasters-funeral.lid-choice~watched"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.lid-choice~watched.vo-01", speaker: agnes, text: "We wait. If she's only a dead girl, she deserves to be buried whole."}
    - {id: "n2-burgomasters-funeral.lid-choice~watched.vo-02", speaker: narrator, text: "Nobody in the church looks away from the coffin, so nobody sees the candles go out one by one along the back wall."}
- id: "n2-burgomasters-funeral.04"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.04.vo-01", speaker: narrator, text: "The candles bow all at once. Dorka Halasz sits up in her wedding dress, and it is the sweetest smile anyone in the room has ever seen."}
- id: "n2-burgomasters-funeral.05"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.05.vo-01", speaker: dorka, note: "source: adapted from Stoker", text: "Come to me. Leave these others and come to me. My arms are hungry for you. Lenka's waiting. She'll be so glad."}
    - {id: "n2-burgomasters-funeral.05.vo-02", speaker: agnes, text: "Lenka is waiting for us, child. Not for you."}
- id: "n2-burgomasters-funeral.06"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.06.vo-01", speaker: tomas, text: "Everyone out! Behind me!"}
    - {id: "n2-burgomasters-funeral.06.vo-02", speaker: dorka, text: "He's so kind. She's in the lady's rooms, in a white dress. She won't stop saying no. He's so patient with her."}
- id: "n2-burgomasters-funeral.07"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.07.vo-01", speaker: narrator, text: "When it is done, Dorka is only a girl in a wedding dress again, with garlic in her mouth and a peace on her face she did not have a minute ago."}
    - {id: "n2-burgomasters-funeral.07.vo-02", speaker: wren, text: "\"She won't stop saying no.\" Good girl."}
- id: "n2-burgomasters-funeral.mourner-returns.agnes"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.mourner-returns.agnes.vo-01", speaker: agnes, text: "I followed the cloak. A castle servant, laying a violet on Anton's grave. He said, \"She still refuses,\" and went up to the east wing. The lady's rooms."}
- id: "n2-burgomasters-funeral.mourner-returns.tomas"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.mourner-returns.tomas.vo-01", speaker: tomas, text: "Followed him to the grave. Castle livery. Left a violet for Anton and said, \"She still refuses.\" Then up the hill to the east wing. The lady's rooms."}
- id: "n2-burgomasters-funeral.mourner-returns.wren"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.mourner-returns.wren.vo-01", speaker: wren, text: "Castle servant. Violet on Anton's grave. Said \"She still refuses.\" Went up to the east wing. Lady's rooms. That's where she is."}
- id: "n2-burgomasters-funeral.mourner-returns.emeric"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.mourner-returns.emeric.vo-01", speaker: emeric, text: "I'm back, I'm sorry, I followed him. A castle servant. He left a violet on Anton's grave and said, \"She still refuses.\" East wing. The lady's rooms."}
- id: "n2-burgomasters-funeral.08"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.08.vo-01", speaker: agnes, text: "Hold on to that, all of you. Every night she refuses him is a night she's still ours."}
- id: "n2-burgomasters-funeral.10"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.10.vo-01", speaker: narrator, text: "They bury Anton Morosz at dawn, properly. On the lid, someone has left a pressed violet. No one saw who."}
- id: "n2-burgomasters-funeral.07~fight-lost"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.07~fight-lost.vo-01", speaker: narrator, text: "Dorka is gone through the window, laughing, up the hill road."}
    - {id: "n2-burgomasters-funeral.07~fight-lost.vo-02", speaker: wren, text: "She'll tell him we're coming."}
- id: "n2-burgomasters-funeral.04~holy-symbol"
  source: n2-burgomasters-funeral.md
  lines:
    - {id: "n2-burgomasters-funeral.04~holy-symbol.vo-01", speaker: narrator, text: "The candles bow. Dorka sits up in her wedding dress, and the saint's lamp flares, and she shields her eyes and smiles anyway."}
- id: "n23-catacombs-of-saint-ysolde.01~village"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.01~village.vo-01", speaker: narrator, text: "The well-rope goes down into the plague dead, and further. Behind you, the wall closes like a mouth."}
- id: "n23-catacombs-of-saint-ysolde.01~sanctuary"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.01~sanctuary.vo-01", speaker: narrator, text: "Behind the altar, a stair Father Oskar had bricked up goes down further than the hill is tall. Behind you, the wall closes like a mouth."}
- id: "n23-catacombs-of-saint-ysolde.01~bazaar"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.01~bazaar.vo-01", speaker: narrator, text: "The reliquary-seller's cellar has a cellar, and that one has a stair. Behind you, the wall closes like a mouth."}
- id: "n23-catacombs-of-saint-ysolde.01~citadel"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.01~citadel.vo-01", speaker: narrator, text: "The lord's chapel floor lifts on a ring, onto a stair that goes down too far. Behind you, the wall closes like a mouth."}
- id: "n23-catacombs-of-saint-ysolde.02"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.02.vo-01", speaker: wren, text: "Passage split. Left smells of lamp oil. Right smells of nothing. Nothing's worse."}
    - {id: "n23-catacombs-of-saint-ysolde.02.vo-02", speaker: tomas, text: "Then we split too, lass, and we meet at the saint."}
- id: "n23-catacombs-of-saint-ysolde.03"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.03.vo-01", speaker: narrator, text: "The party splits. On the map, the passages redraw themselves behind you."}
- id: "n23-catacombs-of-saint-ysolde.rejoin.agnes"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.rejoin.agnes.vo-01", speaker: agnes, text: "There was plainchant in my passage, in my own voice. Something down here has learned how we sound. Trust faces before voices tonight."}
- id: "n23-catacombs-of-saint-ysolde.rejoin.tomas"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.rejoin.tomas.vo-01", speaker: tomas, text: "Guard bones in my wall, lass, with the notch in the teeth we filed for luck. Any of us who doesn't know that notch isn't one of us."}
- id: "n23-catacombs-of-saint-ysolde.rejoin.wren"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.rejoin.wren.vo-01", speaker: wren, text: "Fresh earth on my steps. A coffin went down and back up this week. Whatever it carried is at the castle now."}
- id: "n23-catacombs-of-saint-ysolde.rejoin.emeric"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.rejoin.emeric.vo-01", speaker: emeric, text: "Gerhardt's chalk, all the way down. Arrows, then \"BACK.\" He reached the saint and turned round. Follow his arrows out, not the walls."}
- id: "n23-catacombs-of-saint-ysolde.rejoin-combined"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.rejoin-combined.vo-01", speaker: tomas, text: "Guard bones with the notch, and a coffin carried up this week."}
    - {id: "n23-catacombs-of-saint-ysolde.rejoin-combined.vo-02", speaker: wren, text: "Then he's moving his old garrison up the hill. For the last night."}
- id: "n23-catacombs-of-saint-ysolde.05"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.05.vo-01", speaker: emeric, text: "Sister. Your hand is bleeding."}
    - {id: "n23-catacombs-of-saint-ysolde.05.vo-02", speaker: agnes, text: "My hand is always bleeding near this saint. Give me room."}
- id: "n23-catacombs-of-saint-ysolde.06"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.06.vo-01", speaker: narrator, text: "Agnes sets her empty reliquary into the niche. It fits. The flame inside the lamp leans toward her, the way a dog leans toward its owner."}
    - {id: "n23-catacombs-of-saint-ysolde.06.vo-02", speaker: agnes, text: "I carried you out of the fire. I lost you on the road. Forgive me."}
- id: "n23-catacombs-of-saint-ysolde.07"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.07.vo-01", speaker: narrator, text: "Holy water hisses on one of you like fat in a pan."}
    - {id: "n23-catacombs-of-saint-ysolde.07.vo-02", speaker: tomas, note: "axe up", text: "Show me your left hand. Now."}
- id: "n23-catacombs-of-saint-ysolde.08"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.08.vo-01", speaker: narrator, text: "The thing wearing a friend's face smiles with too many teeth and comes apart into grave-dirt. Further back in the dark, the real one is calling your names."}
    - {id: "n23-catacombs-of-saint-ysolde.08.vo-02", speaker: wren, text: "Found them. Tied up, alive. Furious."}
- id: "n23-catacombs-of-saint-ysolde.09"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.09.vo-01", speaker: narrator, text: "You climb into the air. It is the first time any of you has been glad of the mist."}
- id: "n23-catacombs-of-saint-ysolde.09~lookalike-hidden"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.09~lookalike-hidden.vo-01", speaker: narrator, text: "You climb into the air. Everyone has a shadow. You count them twice."}
- id: "n23-catacombs-of-saint-ysolde.07~lookalike-is-tomas"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.07~lookalike-is-tomas.vo-01", speaker: narrator, text: "Holy water hisses on one of you like fat in a pan."}
    - {id: "n23-catacombs-of-saint-ysolde.07~lookalike-is-tomas.vo-02", speaker: wren, text: "Hand. Left one. Now."}
- id: "n23-catacombs-of-saint-ysolde.06~night3"
  source: n23-catacombs-of-saint-ysolde.md
  lines:
    - {id: "n23-catacombs-of-saint-ysolde.06~night3.vo-01", speaker: narrator, text: "Agnes sets her reliquary into the niche. The flame leans toward her. Wrapped on its carrier's back, the brother's sword hums, answering."}
- id: "n23-sergius-blade.01~village"
  source: n23-sergius-blade.md
  lines:
    - {id: "n23-sergius-blade.01~village.vo-01", speaker: narrator, text: "Under the floor of the burned house, in a lead-lined chest, the cloth falls away. The blade throws light on the ceiling, though there is no window and no candle."}
- id: "n23-sergius-blade.01~sanctuary"
  source: n23-sergius-blade.md
  lines:
    - {id: "n23-sergius-blade.01~sanctuary.vo-01", speaker: narrator, text: "In the ossuary, laid across the skulls of the smiths who made it, the cloth falls away. The blade throws light on the ceiling, though there is no candle."}
- id: "n23-sergius-blade.01~bazaar"
  source: n23-sergius-blade.md
  lines:
    - {id: "n23-sergius-blade.01~bazaar.vo-01", speaker: narrator, text: "On the cold anvil, as if the smith only stepped out, the cloth falls away. The blade throws light on the rafters, though there is no candle."}
- id: "n23-sergius-blade.01~citadel"
  source: n23-sergius-blade.md
  lines:
    - {id: "n23-sergius-blade.01~citadel.vo-01", speaker: narrator, text: "Behind the armoury door, which squeaks exactly as Tomas said it would, the cloth falls away. The blade throws light on the ceiling, though there is no candle."}
- id: "n23-sergius-blade.02"
  source: n23-sergius-blade.md
  lines:
    - {id: "n23-sergius-blade.02.vo-01", speaker: wren, text: "There's a name on the cross-guard. \"Sergiu.\""}
    - {id: "n23-sergius-blade.02.vo-02", speaker: tomas, text: "The old lords had a younger son by that name. The guard used to drink to him. Nobody remembered why."}
- id: "n23-sergius-blade.grip-shared"
  source: n23-sergius-blade.md
  lines:
    - {id: "n23-sergius-blade.grip-shared.vo-01", speaker: emeric, text: "The grip's wrapped in the weave from Lenka's shawl. Gerhardt called it the old house."}
    - {id: "n23-sergius-blade.grip-shared.vo-02", speaker: tomas, text: "And the guard drank to the son who kept the window. Her shawl, his sword. One house."}
- id: "n23-sergius-blade.03"
  source: n23-sergius-blade.md
  lines:
    - {id: "n23-sergius-blade.03.vo-01", speaker: narrator, text: "The wolves stop. In the doorway stands a tall old man with a white moustache, in black from head to foot."}
    - {id: "n23-sergius-blade.03.vo-02", speaker: count, note: "source: Stoker", text: "\"Listen to them, the children of the night. What music they make!\""}
- id: "n23-sergius-blade.04"
  source: n23-sergius-blade.md
  lines:
    - {id: "n23-sergius-blade.04.vo-01", speaker: count, text: "Miss Morosz sends her regrets. She is resting. She has your stubbornness, Sister; she refuses me every evening."}
    - {id: "n23-sergius-blade.04.vo-02", speaker: agnes, text: "Then she's alive, and she's winning."}
- id: "n23-sergius-blade.05"
  source: n23-sergius-blade.md
  lines:
    - {id: "n23-sergius-blade.05.vo-01", speaker: agnes, note: "stepping between, thumb on her scar", text: "You. The traveler. I nursed you three nights."}
    - {id: "n23-sergius-blade.05.vo-02", speaker: count, text: "And you were kind, Sister. It is a rare thing to be nursed by someone who means it."}
- id: "n23-sergius-blade.06"
  source: n23-sergius-blade.md
  lines:
    - {id: "n23-sergius-blade.06.vo-01", speaker: narrator, text: "Tomas lifts the sword. The light in it turns gold, and the Count steps back, once, as a man steps back from a fire."}
    - {id: "n23-sergius-blade.06.vo-02", speaker: count, text: "Put that down, soldier. It was never yours. It was never anyone's but his."}
- id: "n23-sergius-blade.07"
  source: n23-sergius-blade.md
  lines:
    - {id: "n23-sergius-blade.07.vo-01", speaker: emeric, text: "It hurts him. It actually hurts him. I'm writing it down."}
    - {id: "n23-sergius-blade.07.vo-02", speaker: count, note: "after: he is gone; the wolves howl again", text: "Write well, Herr Lutz. Your master's handwriting was dreadful."}
- id: "n23-sergius-blade.09"
  source: n23-sergius-blade.md
  lines:
    - {id: "n23-sergius-blade.09.vo-01", speaker: narrator, text: "The sword keeps its light all the way back to the road. Behind you, something on four legs follows at a distance and does not try to catch up."}
- id: "n23-sergius-blade.06~night3"
  source: n23-sergius-blade.md
  lines:
    - {id: "n23-sergius-blade.06~night3.vo-01", speaker: agnes, text: "Two lights now, traveler. The saint's and his brother's."}
    - {id: "n23-sergius-blade.06~night3.vo-02", speaker: count, text: "Two lamps against the dark. How touching. I have had four hundred years of dark."}
- id: "n23-sergius-blade.09~guard"
  source: n23-sergius-blade.md
  lines:
    - {id: "n23-sergius-blade.09~guard.vo-01", speaker: narrator, text: "He looks past you, up at the castle, as if someone there had called him. The sword keeps its light all the way back to the road."}
- id: "n3-fly-eaters-cell.01"
  source: n3-fly-eaters-cell.md
  lines:
    - {id: "n3-fly-eaters-cell.01.vo-01", speaker: narrator, text: "Jakob Brenner kept the castle's books for twenty years. Then one spring he walked down the hill and asked the lord to lock him up, for safety. Whose safety, he would not say."}
- id: "n3-fly-eaters-cell.02"
  source: n3-fly-eaters-cell.md
  lines:
    - {id: "n3-fly-eaters-cell.02.vo-01", speaker: jakob, note: "source: Stoker", text: "Visitors! \"The blood is the life,\" gentlemen. Flies are only a little life. One must start small."}
    - {id: "n3-fly-eaters-cell.02.vo-02", speaker: emeric, text: "Is that from scripture?"}
    - {id: "n3-fly-eaters-cell.02.vo-03", speaker: jakob, text: "It's from the ledger, boy. Debit, credit."}
- id: "n3-fly-eaters-cell.03"
  source: n3-fly-eaters-cell.md
  lines:
    - {id: "n3-fly-eaters-cell.03.vo-01", speaker: tomas, text: "Brenner. You paid the guard on Fridays. You knew where the girls went."}
    - {id: "n3-fly-eaters-cell.03.vo-02", speaker: jakob, text: "I knew what they cost, Sergeant Varga. That's a different column."}
- id: "n3-fly-eaters-cell.04"
  source: n3-fly-eaters-cell.md
  lines:
    - {id: "n3-fly-eaters-cell.04.vo-01", speaker: jakob, text: "You want the burgomaster's girl. The Master's lady. He's had her room aired. Four hundred years it's been aired. I know the plan. Plans cost."}
    - {id: "n3-fly-eaters-cell.04.vo-02", speaker: wren, text: "Name the price."}
- id: "n3-fly-eaters-cell.05"
  source: n3-fly-eaters-cell.md
  lines:
    - {id: "n3-fly-eaters-cell.05.vo-01", speaker: jakob, note: "cupped hand held out", text: "Something that matters. A drop of one of you on my tongue, or a thing you carry that he fears. Debit, credit."}
- id: "n3-fly-eaters-cell.06"
  source: n3-fly-eaters-cell.md
  lines:
    - {id: "n3-fly-eaters-cell.06.vo-01", speaker: jakob, text: "He sleeps in his own earth, carried down in boxes. Burn the boxes and he has nowhere to lie but the one. On the last night he takes her up to the high room and asks her to open the window herself. That's the rule. She has to open it."}
    - {id: "n3-fly-eaters-cell.06.vo-02", speaker: jakob, text: "She never has."}
- id: "n3-fly-eaters-cell.07"
  source: n3-fly-eaters-cell.md
  lines:
    - {id: "n3-fly-eaters-cell.07.vo-01", speaker: emeric, text: "How many boxes?"}
    - {id: "n3-fly-eaters-cell.07.vo-02", speaker: jakob, text: "I wrote the shipping orders. Fifty years of earth."}
    - {id: "n3-fly-eaters-cell.07.vo-03", speaker: jakob, note: "giggles", text: "You won't find them all. I didn't."}
- id: "n3-fly-eaters-cell.08"
  source: n3-fly-eaters-cell.md
  lines:
    - {id: "n3-fly-eaters-cell.08.vo-01", speaker: jakob, note: "source: Stoker; suddenly very calm", text: "\"I don't want to talk to you: you don't count now; the Master is at hand.\""}
    - {id: "n3-fly-eaters-cell.08.vo-02", speaker: agnes, text: "Then we're done here. Wren, the door."}
- id: "n3-fly-eaters-cell.10"
  source: n3-fly-eaters-cell.md
  lines:
    - {id: "n3-fly-eaters-cell.10.vo-01", speaker: narrator, text: "Behind you, the cell fills with flies again, and Jakob is singing a counting song under his breath."}
- id: "n3-fly-eaters-cell.05~paid-blood"
  source: n3-fly-eaters-cell.md
  lines:
    - {id: "n3-fly-eaters-cell.05~paid-blood.vo-01", speaker: jakob, note: "licking his lips", text: "Oh, he does like you. I can taste it. Debit."}
- id: "n3-fly-eaters-cell.05~paid-item"
  source: n3-fly-eaters-cell.md
  lines:
    - {id: "n3-fly-eaters-cell.05~paid-item.vo-01", speaker: jakob, note: "cradling it, hissing at it", text: "He'll hate that I have this. Lovely. Debit."}
- id: "n3-fly-eaters-cell.06~refused"
  source: n3-fly-eaters-cell.md
  lines:
    - {id: "n3-fly-eaters-cell.06~refused.vo-01", speaker: jakob, text: "He sleeps in boxes. That's all you get for nothing. Credit nothing, debit nothing."}
- id: "n3-fly-eaters-cell.06~obj3"
  source: n3-fly-eaters-cell.md
  lines:
    - {id: "n3-fly-eaters-cell.06~obj3.vo-01", speaker: jakob, text: "And he wants the brother's sword in the river before she ever sees it."}
- id: "n4-earth-boxes.01"
  source: n4-earth-boxes.md
  lines:
    - {id: "n4-earth-boxes.01.vo-01", speaker: narrator, text: "The fourth day. The mist is so thick now that noon looks like evening. Every box you open breathes out cold, like a cellar door."}
- id: "n4-earth-boxes.02"
  source: n4-earth-boxes.md
  lines:
    - {id: "n4-earth-boxes.02.vo-01", speaker: emeric, text: "Graveyard soil, but not this valley's. Halbrook, page ninety: they must rest in their own earth, or not at all."}
    - {id: "n4-earth-boxes.02.vo-02", speaker: wren, text: "Then not at all. Lamp oil."}
- id: "n4-earth-boxes.03~a"
  source: n4-earth-boxes.md
  lines:
    - {id: "n4-earth-boxes.03~a.vo-01", speaker: narrator, text: "The earth burns like peat. Somewhere up on the hill, someone feels it."}
- id: "n4-earth-boxes.03~b"
  source: n4-earth-boxes.md
  lines:
    - {id: "n4-earth-boxes.03~b.vo-01", speaker: narrator, text: "This box screams as it burns. Not the wood. The earth."}
- id: "n4-earth-boxes.03~c"
  source: n4-earth-boxes.md
  lines:
    - {id: "n4-earth-boxes.03~c.vo-01", speaker: narrator, text: "Bats pour out of the smoke and scatter toward the castle like ash going home."}
- id: "n4-earth-boxes.03~last"
  source: n4-earth-boxes.md
  lines:
    - {id: "n4-earth-boxes.03~last.vo-01", speaker: narrator, text: "The last box goes up in one breath. On the hill, for the first time in a generation, a castle window goes dark."}
- id: "n4-earth-boxes.04"
  source: n4-earth-boxes.md
  lines:
    - {id: "n4-earth-boxes.04.vo-01", speaker: tomas, text: "I helped carry these. Twenty years ago, first week in the guard. Told it was the old lord's garden soil."}
    - {id: "n4-earth-boxes.04.vo-02", speaker: agnes, text: "Then you're helping carry them out again, Varga. That's what penance looks like. Heavy."}
- id: "n4-earth-boxes.05"
  source: n4-earth-boxes.md
  lines:
    - {id: "n4-earth-boxes.05.vo-01", speaker: narrator, text: "In one box, pressed into the earth as if by a sleeping cheek, a dried mountain violet."}
    - {id: "n4-earth-boxes.05.vo-02", speaker: wren, text: "Hers. He took it off her sill and sleeps with it."}
- id: "n4-earth-boxes.06"
  source: n4-earth-boxes.md
  lines:
    - {id: "n4-earth-boxes.06.vo-01", speaker: count, note: "source: Stoker", text: "You think to baffle me, you, with your pale faces all in a row, like sheep in a butcher's."}
    - {id: "n4-earth-boxes.06.vo-02", speaker: wren, note: "striking a match", text: "Baa."}
- id: "n4-earth-boxes.08~all-burned"
  source: n4-earth-boxes.md
  lines:
    - {id: "n4-earth-boxes.08~all-burned.vo-01", speaker: narrator, text: "Every box is ash. Wherever he lies tonight, he lies uneasy."}
- id: "n4-earth-boxes.08~some-left"
  source: n4-earth-boxes.md
  lines:
    - {id: "n4-earth-boxes.08~some-left.vo-01", speaker: narrator, text: "Some boxes stand where you could not reach them. He will sleep well in one of them, and wake strong."}
- id: "n4-earth-boxes.08~none-burned"
  source: n4-earth-boxes.md
  lines:
    - {id: "n4-earth-boxes.08~none-burned.vo-01", speaker: narrator, text: "You found the boxes too late. He sleeps well tonight, and he knows you know."}
- id: "n4-earth-boxes.02~unmarked"
  source: n4-earth-boxes.md
  lines:
    - {id: "n4-earth-boxes.02~unmarked.vo-01", speaker: wren, text: "No map. Follow the smell."}
    - {id: "n4-earth-boxes.02~unmarked.vo-02", speaker: emeric, text: "Follow the... of course. Of course we do."}
- id: "n4-earth-boxes.06~unmarked"
  source: n4-earth-boxes.md
  lines:
    - {id: "n4-earth-boxes.06~unmarked.vo-01", speaker: count, text: "Jakob is loyal. He is the only one of you who is."}
    - {id: "n4-earth-boxes.06~unmarked.vo-02", speaker: wren, note: "striking a match", text: "Then he can watch."}
- id: "n4-finding-the-tome.01~village"
  source: n4-finding-the-tome.md
  lines:
    - {id: "n4-finding-the-tome.01~village.vo-01", speaker: narrator, text: "In the burned archive, the only book the fire left. The lock opens before anyone touches it. He wants this read."}
- id: "n4-finding-the-tome.01~sanctuary"
  source: n4-finding-the-tome.md
  lines:
    - {id: "n4-finding-the-tome.01~sanctuary.vo-01", speaker: narrator, text: "Chained in the abbey library, the chain rusted through. The lock opens before anyone touches it. He wants this read."}
- id: "n4-finding-the-tome.01~bazaar"
  source: n4-finding-the-tome.md
  lines:
    - {id: "n4-finding-the-tome.01~bazaar.vo-01", speaker: narrator, text: "In a fence's crate of stolen goods, under a velvet cloth. The lock opens before anyone touches it. He wants this read."}
- id: "n4-finding-the-tome.01~citadel"
  source: n4-finding-the-tome.md
  lines:
    - {id: "n4-finding-the-tome.01~citadel.vo-01", speaker: narrator, text: "On the lord's study desk, as if set out for a guest. The lock opens before anyone touches it. He wants this read."}
- id: "n4-finding-the-tome.02"
  source: n4-finding-the-tome.md
  lines:
    - {id: "n4-finding-the-tome.02.vo-01", speaker: emeric, note: "reading", text: "\"I, Vlad, first son of this house, set down how I lost my soul, so that whoever reads this may know it was not taken. I gave it.\""}
    - {id: "n4-finding-the-tome.02.vo-02", speaker: agnes, text: "\"The name of the first.\" Oskar's riddle. It was never a place. It was him."}
- id: "n4-finding-the-tome.03"
  source: n4-finding-the-tome.md
  lines:
    - {id: "n4-finding-the-tome.03.vo-01", speaker: emeric, text: "\"I loved Ludmila of the high meadow. She loved my brother Sergiu. On their wedding night I made a bargain with what answers when God does not, and I killed my brother with his own sword.\""}
    - {id: "n4-finding-the-tome.03.vo-02", speaker: tomas, text: "The sword we're carrying. Sergiu's."}
- id: "n4-finding-the-tome.04"
  source: n4-finding-the-tome.md
  lines:
    - {id: "n4-finding-the-tome.04.vo-01", speaker: narrator, text: "On the next page, a different hand. Small, quick, a girl's. A mountain violet is pressed into the gutter of the book."}
    - {id: "n4-finding-the-tome.04.vo-02", speaker: ludmila, note: "from the page", text: "\"He has asked me to open the window and let him in. I will open it, but not for him. If I come again, I will choose again, and it will not be you.\""}
- id: "n4-finding-the-tome.05"
  source: n4-finding-the-tome.md
  lines:
    - {id: "n4-finding-the-tome.05.vo-01", speaker: emeric, text: "And beneath, his hand: \"She opened the window and stepped out of it. I have waited for her ever since. She always comes again. She always chooses again.\""}
    - {id: "n4-finding-the-tome.05.vo-02", speaker: agnes, text: "And the last entry. Read the last entry."}
- id: "n4-finding-the-tome.06"
  source: n4-finding-the-tome.md
  lines:
    - {id: "n4-finding-the-tome.06.vo-01", speaker: emeric, note: "fresh ink", text: "\"She has come again, in the burgomaster's house. Ludmila's soul, Lenka's face. I have brought her home. Every evening I ask. Every evening she says: I am not her, and even if I were, no.\""}
    - {id: "n4-finding-the-tome.06.vo-02", speaker: agnes, text: "Then it's true. She is his Ludmila, come round again. And she is refusing him, in his own house, every night."}
- id: "n4-finding-the-tome.07"
  source: n4-finding-the-tome.md
  lines:
    - {id: "n4-finding-the-tome.07.vo-01", speaker: agnes, text: "That's not his tragedy. That's her victory. Four hundred years of no. We only have to get her to say it to his face, with the sword in the room."}
- id: "n4-finding-the-tome.08"
  source: n4-finding-the-tome.md
  lines:
    - {id: "n4-finding-the-tome.08.vo-01", speaker: emeric, text: "Last page, his hand, shaking: \"Only her refusal wounds me. Only my brother's sword can finish what she begins.\""}
    - {id: "n4-finding-the-tome.08.vo-02", speaker: wren, text: "So we get her out, she says no to his face, and we put the sword through him while he's hearing it."}
- id: "n4-finding-the-tome.10"
  source: n4-finding-the-tome.md
  lines:
    - {id: "n4-finding-the-tome.10.vo-01", speaker: count, note: "from everywhere; source: Stoker", text: "\"Your girls that you all love are mine already.\" Come up the hill tomorrow night, all of you, and watch her open the window."}
    - {id: "n4-finding-the-tome.10.vo-02", speaker: lenka, note: "far off, through the mist", text: "My name is Lenka Morosz. Bring the sword."}
- id: "n4-finding-the-tome.11"
  source: n4-finding-the-tome.md
  lines:
    - {id: "n4-finding-the-tome.11.vo-01", speaker: narrator, text: "Dawn does not come. Only a greyness, and the castle above it, every window lit."}
- id: "n5-drawbridge.01"
  source: n5-drawbridge.md
  lines:
    - {id: "n5-drawbridge.01.vo-01", speaker: narrator, text: "Five nights. Three keys. A brother's sword. The road to the castle is the only road left in Vellmoor; the mist has eaten every other one."}
- id: "n5-drawbridge.02"
  source: n5-drawbridge.md
  lines:
    - {id: "n5-drawbridge.02.vo-01", speaker: narrator, text: "The keys turn, one after another, in locks no one can see. The drawbridge comes down, slow as a held breath."}
    - {id: "n5-drawbridge.02.vo-02", speaker: count, note: "from the battlements; source: Stoker", text: "\"Welcome to my house! Enter freely and of your own will!\""}
- id: "n5-drawbridge.03"
  source: n5-drawbridge.md
  lines:
    - {id: "n5-drawbridge.03.vo-01", speaker: tomas, text: "He's said the words; the front door's his, and he'll watch every step. The little gate's twenty yards left, the long way round. It squeaks."}
    - {id: "n5-drawbridge.03.vo-02", speaker: wren, text: "Long way costs time. Front way costs surprise."}
- id: "n5-drawbridge.04"
  source: n5-drawbridge.md
  lines:
    - {id: "n5-drawbridge.04.vo-01", speaker: narrator, text: "The little gate opens a hand's width. A girl in a maid's apron over faded castle livery stands behind it with a lamp turned low."}
    - {id: "n5-drawbridge.04.vo-02", speaker: marta, text: "Uncle Tomas. You came back over the wall."}
- id: "n5-drawbridge.05"
  source: n5-drawbridge.md
  lines:
    - {id: "n5-drawbridge.05.vo-01", speaker: tomas, text: "I did, love. I'm sorry it took me so long. Where is she, the burgomaster's girl?"}
    - {id: "n5-drawbridge.05.vo-02", speaker: marta, text: "The high room, at the top of the stair behind the gallery. In a white dress. She hasn't said yes. Not once. I'll open the gate if you ask. It's the slow way, but he never watches it."}
- id: "n5-drawbridge.07~gate"
  source: n5-drawbridge.md
  lines:
    - {id: "n5-drawbridge.07~gate.vo-01", speaker: narrator, text: "You go the long way, the way the servant girls once left. It takes too long. But nothing on the battlements turns its head."}
- id: "n5-drawbridge.07~drawbridge"
  source: n5-drawbridge.md
  lines:
    - {id: "n5-drawbridge.07~drawbridge.vo-01", speaker: narrator, text: "You walk in by the front door, as guests, and quickly. Above you, something on the battlements turns its head and follows you in."}
- id: "n5-drawbridge.01~boxes-left"
  source: n5-drawbridge.md
  lines:
    - {id: "n5-drawbridge.01~boxes-left.vo-01", speaker: narrator, text: "Five nights. Three keys. A brother's sword. And no smoke rising from the hill: somewhere up there, his earth is still waiting for him."}
- id: "n5-drawbridge.02~boxes-left"
  source: n5-drawbridge.md
  lines:
    - {id: "n5-drawbridge.02~boxes-left.vo-01", speaker: narrator, text: "The keys turn. The drawbridge comes down."}
    - {id: "n5-drawbridge.02~boxes-left.vo-02", speaker: count, note: "warm, rested; source: Stoker", text: "\"Welcome to my house! Enter freely and of your own will!\""}
- id: "n5-ending-endures.01"
  source: n5-ending-endures.md
  lines:
    - {id: "n5-ending-endures.01.vo-01", speaker: narrator, text: "Dawn comes, thin and grey. Lenka is standing at the open window, free. The Count is not dust. He is a scarf of mist going up the mountain, and the brother's sword is not in the room to stop him."}
- id: "n5-ending-endures.02"
  source: n5-ending-endures.md
  lines:
    - {id: "n5-ending-endures.02.vo-01", speaker: lenka, text: "He's gone. He's not dead, is he?"}
    - {id: "n5-ending-endures.02.vo-02", speaker: agnes, text: "No, child. But you're out, and you said no to his face. That will hurt him for a long time."}
- id: "n5-ending-endures.03"
  source: n5-ending-endures.md
  lines:
    - {id: "n5-ending-endures.03.vo-01", speaker: count, note: "far off; source: Stoker", text: "\"My revenge is just begun! I spread it over centuries, and time is on my side.\""}
    - {id: "n5-ending-endures.03.vo-02", speaker: wren, text: "Then we'll spend ours finding the sword."}
- id: "n5-ending-endures.05"
  source: n5-ending-endures.md
  lines:
    - {id: "n5-ending-endures.05.vo-01", speaker: narrator, text: "Lenka Morosz walks down the hill road in the morning, and the mist lets her. Above, on the mountain, it is thickening again."}
- id: "n5-ending-rescued.01"
  source: n5-ending-rescued.md
  lines:
    - {id: "n5-ending-rescued.01.vo-01", speaker: narrator, text: "The sun comes into the high room through the window she opened. The Count is dust, and the dust has a shape for a moment, kneeling. The brother's sword is cool in its carrier's hand."}
- id: "n5-ending-rescued.02"
  source: n5-ending-rescued.md
  lines:
    - {id: "n5-ending-rescued.02.vo-01", speaker: narrator, text: "In the light, two figures not quite there: a young man with a sword like the one you carry, and a girl holding violets. She looks at Lenka. She nods, once, and they are gone."}
    - {id: "n5-ending-rescued.02.vo-02", speaker: lenka, text: "She chose. Every time, she chose. [pause 1] So did I."}
- id: "n5-ending-rescued.03"
  source: n5-ending-rescued.md
  lines:
    - {id: "n5-ending-rescued.03.vo-01", speaker: agnes, text: "Then come home, child. The burgomaster's house needs a burgomaster."}
    - {id: "n5-ending-rescued.03.vo-02", speaker: lenka, text: "It needs a priest first. Will you stay till we find one, Sister?"}
- id: "n5-ending-rescued.04"
  source: n5-ending-rescued.md
  lines:
    - {id: "n5-ending-rescued.04.vo-01", speaker: wren, note: "the brides are ash; one ribbon on the stair", text: "Ilka Kessel. Put back right."}
    - {id: "n5-ending-rescued.04.vo-02", speaker: tomas, text: "I'll dig with you, lass. I owe a lot of graves."}
- id: "n5-ending-rescued.05"
  source: n5-ending-rescued.md
  lines:
    - {id: "n5-ending-rescued.05.vo-01", speaker: emeric, text: "I'm going to finish the treatise, and put his name on the title page: Gerhardt Albrecht. And all of yours."}
    - {id: "n5-ending-rescued.05.vo-02", speaker: tomas, text: "Leave mine off, lad. Write \"the guard at the gate.\""}
- id: "n5-ending-rescued.07"
  source: n5-ending-rescued.md
  lines:
    - {id: "n5-ending-rescued.07.vo-01", speaker: narrator, text: "The mist lifts off Vellmoor. The road out is there again, and nobody takes it today."}
- id: "n5-ending-taken.01"
  source: n5-ending-taken.md
  lines:
    - {id: "n5-ending-taken.01.vo-01", speaker: narrator, text: "You come down the hill at dawn without her. Behind you, the high window closes. On the road at your feet, a pressed violet, still warm."}
- id: "n5-ending-taken.02"
  source: n5-ending-taken.md
  lines:
    - {id: "n5-ending-taken.02.vo-01", speaker: count, note: "from the battlements; source: Stoker", text: "\"My revenge is just begun! I spread it over centuries, and time is on my side.\""}
    - {id: "n5-ending-taken.02.vo-02", speaker: agnes, text: "Then we will spend ours, traveler. Every year we have."}
- id: "n5-ending-taken.03"
  source: n5-ending-taken.md
  lines:
    - {id: "n5-ending-taken.03.vo-01", speaker: wren, text: "He'll keep her the way he kept Mother."}
    - {id: "n5-ending-taken.03.vo-02", speaker: agnes, text: "And she'll refuse him the way her soul always has. It's a long no, child. We can help her say it."}
- id: "n5-ending-taken.05"
  source: n5-ending-taken.md
  lines:
    - {id: "n5-ending-taken.05.vo-01", speaker: narrator, text: "The mist comes down over the road again. In the castle, every window is lit."}
- id: "n5-ending-taken.01~retreat"
  source: n5-ending-taken.md
  lines:
    - {id: "n5-ending-taken.01~retreat.vo-01", speaker: narrator, text: "You fall back down the stair while you still can. Behind you, the high window closes. At the gate, a pressed violet, still warm."}
- id: "n5-ending-turned.01"
  source: n5-ending-turned.md
  lines:
    - {id: "n5-ending-turned.01.vo-01", speaker: narrator, text: "The third corruption is not the worst one. It is only the last. Somewhere a heartbeat stops, and another one starts, slower."}
- id: "n5-ending-turned.02~agnes"
  source: n5-ending-turned.md
  lines:
    - {id: "n5-ending-turned.02~agnes.vo-01", speaker: narrator, text: "Sister Agnes goes still. Then her reliquary drops from her hand, and the burn on her palm is gone."}
    - {id: "n5-ending-turned.02~agnes.vo-02", speaker: agnes, text: "I prayed for him for ten years. I should have prayed for myself."}
- id: "n5-ending-turned.02~tomas"
  source: n5-ending-turned.md
  lines:
    - {id: "n5-ending-turned.02~tomas.vo-01", speaker: narrator, text: "Tomas Varga goes still. Then he lowers the axe and turns to face the hunters, the way he used to face the gate."}
    - {id: "n5-ending-turned.02~tomas.vo-02", speaker: tomas, text: "I stood his gate three years. Looks like I'm standing it again."}
- id: "n5-ending-turned.02~wren"
  source: n5-ending-turned.md
  lines:
    - {id: "n5-ending-turned.02~wren.vo-01", speaker: narrator, text: "Wren Kessel goes still. Then the crossbow drops, and she smells the air, and smiles at the smell."}
    - {id: "n5-ending-turned.02~wren.vo-02", speaker: wren, text: "Mother's humming. I can hear it properly now."}
- id: "n5-ending-turned.02~emeric"
  source: n5-ending-turned.md
  lines:
    - {id: "n5-ending-turned.02~emeric.vo-01", speaker: narrator, text: "Emeric Lutz goes still. Then his spectacles fall, and he does not pick them up; he can see perfectly in the dark."}
    - {id: "n5-ending-turned.02~emeric.vo-02", speaker: emeric, text: "Page two hundred and twelve. I was wrong. It isn't frightening at all."}
- id: "n5-ending-turned.03"
  source: n5-ending-turned.md
  lines:
    - {id: "n5-ending-turned.03.vo-01", speaker: count, note: "source: Stoker", text: "\"Come freely. Go safely; and leave something of the happiness you bring!\" The rest of you may go. This one stays."}
- id: "n5-ending-turned.05"
  source: n5-ending-turned.md
  lines:
    - {id: "n5-ending-turned.05.vo-01", speaker: narrator, text: "The mist comes down over the road again. In the castle, one more window is lit."}
- id: "n5-ending-turned.05~night5"
  source: n5-ending-turned.md
  lines:
    - {id: "n5-ending-turned.05~night5.vo-01", speaker: lenka, note: "from the window, very quietly", text: "No. Not them too."}
    - {id: "n5-ending-turned.05~night5.vo-02", speaker: lenka, note: "to the Count", text: "My answer is still no."}
- id: "n5-final-confrontation.01"
  source: n5-final-confrontation.md
  lines:
    - {id: "n5-final-confrontation.01.vo-01", speaker: narrator, text: "The brides come down the stair together, barefoot, silent, and the third one is humming."}
- id: "n5-final-confrontation.02"
  source: n5-final-confrontation.md
  lines:
    - {id: "n5-final-confrontation.02.vo-01", speaker: ilka, text: "Wren. My little Wren. You've cut your hair. Come and let me fix it."}
    - {id: "n5-final-confrontation.02.vo-02", speaker: wren, text: "You hid her, Mother. You hid Lenka from him. That's why."}
- id: "n5-final-confrontation.03"
  source: n5-final-confrontation.md
  lines:
    - {id: "n5-final-confrontation.03.vo-01", speaker: ilka, note: "the humming stops", text: "I hid her in the church. I hid you in the grave-rows. He never found either of you. [pause 1] Use the bolt, little one. It has my name on it. I scratched it there while you slept, the night before I went."}
    - {id: "n5-final-confrontation.03.vo-02", speaker: wren, note: "turning the blank bolt; it isn't blank", text: "I. L. K. A."}
- id: "n5-final-confrontation.04"
  source: n5-final-confrontation.md
  lines:
    - {id: "n5-final-confrontation.04.vo-01", speaker: count, note: "source: after Stoker", text: "\"How dare you touch him, any of you?\" She is mine. Ludmila. The window."}
- id: "n5-final-confrontation.05"
  source: n5-final-confrontation.md
  lines:
    - {id: "n5-final-confrontation.05.vo-01", speaker: agnes, text: "I prayed for you once, traveler. I am praying for you now. Rest."}
    - {id: "n5-final-confrontation.05.vo-02", speaker: count, note: "the light holds him; he cannot look away from her", text: "You sound like her. You always did."}
- id: "n5-final-confrontation.06"
  source: n5-final-confrontation.md
  lines:
    - {id: "n5-final-confrontation.06.vo-01", speaker: narrator, text: "While he is held, Lenka stands. In her hand, the last of her violets."}
    - {id: "n5-final-confrontation.06.vo-02", speaker: lenka, text: "My name is Lenka Morosz. I am not her. And if I were, I would say what she said."}
    - {id: "n5-final-confrontation.06.vo-03", speaker: lenka, note: "she opens the window to the grey dawn", text: "No."}
- id: "n5-final-confrontation.07"
  source: n5-final-confrontation.md
  lines:
    - {id: "n5-final-confrontation.07.vo-01", speaker: narrator, text: "Her no goes through him like a draught through an empty house. And his brother's sword finds his heart, and for the first time in four hundred years the Count looks surprised."}
- id: "n5-final-confrontation.blade-lost"
  source: n5-final-confrontation.md
  lines:
    - {id: "n5-final-confrontation.blade-lost.vo-01", speaker: narrator, text: "The hunter carrying Sergiu's sword goes down, and the blade skids away across the flagstones into the dark beneath the window. Nobody can reach it now."}
- id: "n5-final-confrontation.strike-redirected"
  source: n5-final-confrontation.md
  lines:
    - {id: "n5-final-confrontation.strike-redirected.vo-01", speaker: narrator, text: "He turns from you, toward the girl at the window, and whoever stands between them takes the blow."}
- id: "n5-final-confrontation.strike-redirected~blocked"
  source: n5-final-confrontation.md
  lines:
    - {id: "n5-final-confrontation.strike-redirected~blocked.vo-01", speaker: narrator, text: "He turns toward the girl at the window, and you throw the last thing you have between them. It shatters in his hand. The blow falls on nothing, and you are poorer for it."}
- id: "n5-final-confrontation.guard-chosen"
  source: n5-final-confrontation.md
  lines:
    - {id: "n5-final-confrontation.guard-chosen.vo-01", speaker: narrator, text: "Someone must stand at the girl's side, and someone else must carry the sword. It cannot be the same pair of hands."}
- id: "n5-final-confrontation.07~blade-lost"
  source: n5-final-confrontation.md
  lines:
    - {id: "n5-final-confrontation.07~blade-lost.vo-01", speaker: narrator, text: "Her no goes through him like a draught through an empty house. He staggers, and there is no blade to finish it. He goes out of the window as mist, and the mist goes up the mountain."}
- id: "n5-final-confrontation.04~boxes-left"
  source: n5-final-confrontation.md
  lines:
    - {id: "n5-final-confrontation.04~boxes-left.vo-01", speaker: count, text: "My earth still waits for me. I am not tired, Sister. Ludmila. The window."}
- id: "n5-final-confrontation.05~boxes-left"
  source: n5-final-confrontation.md
  lines:
    - {id: "n5-final-confrontation.05~boxes-left.vo-01", speaker: agnes, text: "I prayed for you once, traveler. I am praying for you now. Rest."}
    - {id: "n5-final-confrontation.05~boxes-left.vo-02", speaker: count, note: "after: he shrugs off the light once; per mechanics the battle is harder", text: "Not yet."}
- id: "n5-portrait-gallery.01"
  source: n5-portrait-gallery.md
  lines:
    - {id: "n5-portrait-gallery.01.vo-01", speaker: narrator, text: "The eyes in the portraits follow you. That is ordinary. What is not ordinary is that some of them blink."}
- id: "n5-portrait-gallery.02"
  source: n5-portrait-gallery.md
  lines:
    - {id: "n5-portrait-gallery.02.vo-01", speaker: emeric, text: "Same face. Four hundred years of fashions, and the same face. That's not a dynasty. That's a man."}
    - {id: "n5-portrait-gallery.02.vo-02", speaker: wren, text: "That one's moving."}
- id: "n5-portrait-gallery.03"
  source: n5-portrait-gallery.md
  lines:
    - {id: "n5-portrait-gallery.03.vo-01", speaker: narrator, text: "A painted lord of the house leans out of his frame, a long painted arm reaching for whoever looks at him longest."}
- id: "n5-portrait-gallery.04"
  source: n5-portrait-gallery.md
  lines:
    - {id: "n5-portrait-gallery.04.vo-01", speaker: narrator, text: "At the end of the gallery, Agnes pulls the cloth from the last canvas. A girl in a white dress, holding mountain violets. Lenka's face."}
    - {id: "n5-portrait-gallery.04.vo-02", speaker: agnes, text: "No. Ludmila's. The paint is four hundred years old. The face came back. The girl is upstairs."}
- id: "n5-portrait-gallery.05"
  source: n5-portrait-gallery.md
  lines:
    - {id: "n5-portrait-gallery.05.vo-01", speaker: count, note: "source: Stoker", text: "\"Yes, I too can love; you yourselves can tell it from the past. Is it not so?\""}
    - {id: "n5-portrait-gallery.05.vo-02", speaker: tomas, text: "We've read your past, my lord. It's the reason we brought a stake."}
- id: "n5-portrait-gallery.combine"
  source: n5-portrait-gallery.md
  lines:
    - {id: "n5-portrait-gallery.combine.vo-01", speaker: agnes, text: "Mine is labelled \"The one who prayed.\" He paints the ones he keeps."}
    - {id: "n5-portrait-gallery.combine.vo-02", speaker: wren, text: "Mother's is still wet. And there's nothing of Lenka. Only Ludmila. He hasn't got her."}
- id: "n5-portrait-gallery.07"
  source: n5-portrait-gallery.md
  lines:
    - {id: "n5-portrait-gallery.07.vo-01", speaker: narrator, text: "The wall turns. A stair goes up into the dark, and something at the top is humming, and something above that is saying, quietly, over and over: no."}
- id: "nx-midnight-procession.01"
  source: nx-midnight-procession.md
  lines:
    - {id: "nx-midnight-procession.01.vo-01", speaker: narrator, text: "At the twelfth stroke the dead come walking. Every hunter who ever climbed that hill is in the line. They do not stop. One of them does."}
- id: "nx-midnight-procession.05"
  source: nx-midnight-procession.md
  lines:
    - {id: "nx-midnight-procession.05.vo-01", speaker: narrator, text: "The line walks on into the mist toward the castle. In the morning there will be one more lantern in it, unless you are careful."}
- id: "nx-midnight-procession.01~night1"
  source: nx-midnight-procession.md
  lines:
    - {id: "nx-midnight-procession.01~night1.vo-01", speaker: narrator, text: "At the twelfth stroke the dead come walking. Among them, for a moment, a girl in a nightdress who is not dead, walking up the hill, looking back. Then she is gone. One of them stops."}
- id: "nx-midnight-procession.05~night4"
  source: nx-midnight-procession.md
  lines:
    - {id: "nx-midnight-procession.05~night4.vo-01", speaker: narrator, text: "The line does not walk toward the castle tonight. It waits at the gate. It wants to see the end."}
- id: "nx-pressed-flower.01~night1"
  source: nx-pressed-flower.md
  lines:
    - {id: "nx-pressed-flower.01~night1.vo-01", speaker: narrator, text: "The violet from Lenka's sill, turned over in the dusk light: a thread of white plaster is pressed into it. Castle plaster."}
- id: "nx-pressed-flower.00~night2"
  source: nx-pressed-flower.md
  lines:
    - {id: "nx-pressed-flower.00~night2.vo-01", speaker: narrator, text: "Dusk on the second night. Tomas Varga goes home first. Marta's shutters hang open, the nails pried out and laid in a neat row on the sill. Her bed is cold. On the pillow lies a letter on heavy cream paper: \"Come home.\""}
- id: "nx-pressed-flower.01~night2"
  source: nx-pressed-flower.md
  lines:
    - {id: "nx-pressed-flower.01~night2.vo-01", speaker: narrator, text: "A violet on the lintel at dusk, wrapped in a scrap of painted canvas."}
- id: "nx-pressed-flower.01~night3"
  source: nx-pressed-flower.md
  lines:
    - {id: "nx-pressed-flower.01~night3.vo-01", speaker: narrator, text: "A violet in the dust, its stem tied with a single gold thread from a wedding veil."}
- id: "nx-pressed-flower.01~night4"
  source: nx-pressed-flower.md
  lines:
    - {id: "nx-pressed-flower.01~night4.vo-01", speaker: narrator, text: "The last violet, pressed flat into a page torn from a book in an old girl's hand."}
- id: "enc-early-lantern.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-early-lantern.01.vo-01", speaker: narrator, text: "It is not midnight. Nobody told the dead. One lantern comes up the lane alone, early, as if the mist had torn it off the line."}
- id: "enc-early-lantern.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-early-lantern.02.vo-01", speaker: narrator, text: "It stops in front of one of you. The procession will be one short tonight."}
- id: "enc-the-window.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-the-window.01.vo-01", speaker: narrator, text: "The mist parts on a window that is not in this valley, or is in it every night. A woman in white climbs onto the sill."}
- id: "enc-the-window.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-the-window.02.vo-01", speaker: count, note: "far off", text: "Ludmila. Not the window. Anything but the window."}
    - {id: "enc-the-window.02.vo-02", speaker: ludmila, note: "hushed", text: "Then do not come in."}
- id: "enc-the-window.03"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-the-window.03.vo-01", speaker: narrator, text: "She steps. The mist closes. Somewhere in that room, tonight, another girl is sitting by the same window."}
- id: "enc-the-window.03~blocked"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-the-window.03~blocked.vo-01", speaker: narrator, text: "The grief reaches for one of you and finds no room left. It takes something from your packs instead, and the window goes dark."}
- id: "enc-brothers.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-brothers.01.vo-01", speaker: narrator, text: "Two men fight in the fog below the castle. Brothers, by the faces. The dark one takes the bright sword from the fair one, and uses it."}
    - {id: "enc-brothers.01.vo-02", speaker: count, note: "close, low", text: "I was only meant to take her. Not you. Never you."}
- id: "enc-brothers.01~carrier"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-brothers.01~carrier.vo-01", speaker: narrator, text: "Two men fight in the fog below the castle. The dark one takes the bright sword from his brother, and uses it. At your back, the sword is warm as a hand."}
    - {id: "enc-brothers.01~carrier.vo-02", speaker: count, note: "close, low", text: "I was only meant to take her. Not you. Never you."}
- id: "enc-brothers.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-brothers.02.vo-01", speaker: narrator, text: "The fog takes them both, to begin again up the hill. A villager who stopped to watch does not come out of it. Drop a skull."}
- id: "enc-at-the-door.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-at-the-door.01.vo-01", speaker: narrator, text: "Three knocks. The mist comes under the door and stops at the sill, waiting to be asked."}
    - {id: "enc-at-the-door.01.vo-02", speaker: count, note: "through the door", text: "Only open it. One door always opens, in the end."}
- id: "enc-at-the-door.03"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-at-the-door.03.vo-01", speaker: narrator, text: "The latch stops moving. The voice goes away up the hill, still polite. She refuses him every evening, he said. He said it as a complaint."}
- id: "enc-at-the-door.03~blocked"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-at-the-door.03~blocked.vo-01", speaker: narrator, text: "His breath finds the crack and nothing left to bite. The cold takes one thing from your packs instead, and the voice goes up the hill."}
- id: "enc-wrong-face.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wrong-face.01.vo-01", speaker: narrator, text: "A wall of mist rolls across the street and back. For one breath, one of you is gone. Then you are all there again."}
- id: "enc-wrong-face.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wrong-face.02.vo-01", speaker: narrator, text: "Count heads. Count them again. Everyone is accounted for. That is what worries you."}
- id: "enc-wrong-face.02~lookalike-is-agnes"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wrong-face.02~lookalike-is-agnes.vo-01", speaker: narrator, text: "The thing wearing the Sister's face never once crossed itself. The real Agnes is found in the church porch, praying, cold to the elbows."}
- id: "enc-wrong-face.02~lookalike-is-tomas"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wrong-face.02~lookalike-is-tomas.vo-01", speaker: narrator, text: "The thing wearing Tomas's face had ten whole fingers. The real Tomas is found behind the well, swearing, his axe still in his hand."}
- id: "enc-wrong-face.02~lookalike-is-wren"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wrong-face.02~lookalike-is-wren.vo-01", speaker: narrator, text: "The thing wearing Wren's face hummed her mother's song, and Wren never hums it. The real Wren is found in the lychgate, crossbow cocked at the dark."}
- id: "enc-wrong-face.02~lookalike-is-emeric"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wrong-face.02~lookalike-is-emeric.vo-01", speaker: narrator, text: "The thing wearing Emeric's face wrote nothing down all night. The real Emeric is found in a shuttered shop, writing by feel in the dark."}
- id: "enc-mist-remembers.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-mist-remembers.01.vo-01", speaker: narrator, text: "The mist comes in close and stops being weather. It has seen where each of you has been. It shows you."}
- id: "enc-mist-remembers.03"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-mist-remembers.03.vo-01", speaker: narrator, text: "The fog lets go. Some of you look as if you saw something worth the price. Nobody says what."}
- id: "enc-road-returns.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-road-returns.01.vo-01", speaker: narrator, text: "The road out of the parish goes on for an hour. Then the milestone again. The shrine again. The same crow. An empty cart stands by the shrine, the driver's coat folded on the seat."}
- id: "enc-road-returns.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-road-returns.02.vo-01", speaker: narrator, text: "No one leaves Vellmoor while he holds it. The road, at least, is honest about that."}
- id: "enc-road-returns.02~drop"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-road-returns.02~drop.vo-01", speaker: narrator, text: "By morning the driver will be standing in the square with the others, very pale. Drop a skull."}
- id: "enc-ledger-page.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-ledger-page.01.vo-01", speaker: jakob, note: "from the page", text: "Garden soil. Handle with care. Forty boxes, as last time. And the time before."}
    - {id: "enc-ledger-page.01.vo-02", speaker: emeric, text: "As last time. He has done all of this before."}
- id: "enc-ledger-page.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-ledger-page.02.vo-01", speaker: narrator, text: "More pages lie up the road, one every few yards, toward somewhere dark."}
- id: "enc-ledger-page.02~blocked"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-ledger-page.02~blocked.vo-01", speaker: narrator, text: "You follow the pages a little way. Then the wind takes them all at once, and the page in your pocket with them."}
- id: "enc-wedding-uphill.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wedding-uphill.01.vo-01", speaker: narrator, text: "A wedding goes up the hill in the mist. Veiled girl in front, pale women behind. There is no groom. There never is."}
- id: "enc-wedding-uphill.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wedding-uphill.02.vo-01", speaker: narrator, text: "The veiled girl does not look back. The two at the end of the train do. They smile, and keep smiling."}
- id: "enc-wedding-uphill.03~won"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wedding-uphill.03~won.vo-01", speaker: narrator, text: "They come apart like wet paper. Where the veil trailed, a single gold thread lies in the road."}
- id: "enc-wedding-uphill.03~lost"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wedding-uphill.03~lost.vo-01", speaker: narrator, text: "The train closes over one of you, cold and sweet, and moves on up the hill. Someone in the village follows it. Drop a skull."}
- id: "enc-wedding-uphill.03~lost-blocked"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wedding-uphill.03~lost-blocked.vo-01", speaker: narrator, text: "The train closes over one of you and opens again, as if it found nothing it wanted. It takes something from your packs, and someone from the village. Drop a skull."}
- id: "enc-wedding-uphill.03~lost-cap-reached"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wedding-uphill.03~lost-cap-reached.vo-01", speaker: narrator, text: "The train closes over one of you, cold and sweet, and moves on up the hill. Nobody from the village follows it tonight. It takes something from your packs instead."}
- id: "enc-wedding-uphill.03~lost-blocked-cap-reached"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wedding-uphill.03~lost-blocked-cap-reached.vo-01", speaker: narrator, text: "The train closes over one of you and opens again, as if it found nothing it wanted. It takes something from your packs and goes on up the hill alone."}
- id: "enc-wedding-uphill.03~avoided"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wedding-uphill.03~avoided.vo-01", speaker: narrator, text: "You stand aside with your heads bowed, as you would for any wedding. The brides at the back stop smiling. The procession goes on up the hill without you."}
- id: "enc-wine-for-no-one.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wine-for-no-one.01.vo-01", speaker: marta, text: "Uncle? You shouldn't be here. He drinks at midnight, and he counts the glasses."}
    - {id: "enc-wine-for-no-one.01.vo-02", speaker: tomas, text: "I came back for you, lass. I always meant to."}
- id: "enc-wine-for-no-one.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wine-for-no-one.02.vo-01", speaker: narrator, text: "When you look again there is only the table, and the glass, and the wine going dark."}
- id: "enc-wine-for-no-one.02~blocked"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wine-for-no-one.02~blocked.vo-01", speaker: narrator, text: "She looks at you and sets a second glass. Then she is gone, and both glasses are full."}
- id: "enc-third-hums.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-third-hums.02.vo-01", speaker: narrator, text: "The song moves off toward the castle stair, where it has been going every night for nineteen years."}
- id: "enc-third-hums.02~blocked"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-third-hums.02~blocked.vo-01", speaker: narrator, text: "The tune comes through and the words do not. When it is gone, so is something you had written down."}
