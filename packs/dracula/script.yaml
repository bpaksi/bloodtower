  source: nx-pressed-flower.md
  target: ipad:emeric
  lines:
    - {id: "nx-pressed-flower.02.private.emeric~night3.vo-01", speaker: emeric, note: "thought", text: "A veil. He's dressing her. Above the gallery, where the stair goes up."}
    - {id: "nx-pressed-flower.02.private.emeric~night3.vo-02", speaker: emeric-whisper, note: "thought, aside", text: "Noted, noted, I'm noting it."}
- id: "nx-pressed-flower.01~night4"
  source: nx-pressed-flower.md
  lines:
    - {id: "nx-pressed-flower.01~night4.vo-01", speaker: narrator, text: "The last violet, pressed flat into a page torn from a book in an old girl's hand."}
- id: "nx-pressed-flower.02.private.agnes~night4"
  source: nx-pressed-flower.md
  target: ipad:agnes
  lines:
    - {id: "nx-pressed-flower.02.private.agnes~night4.vo-01", speaker: agnes, note: "thought", text: "The page says: 'the high room, the window I opened.' She's in the room where Ludmila fell."}
    - {id: "nx-pressed-flower.02.private.agnes~night4.vo-02", speaker: agnes-whisper, note: "thought, aside", text: "Child, I hear you."}
- id: "nx-pressed-flower.02.private.tomas~night4"
  source: nx-pressed-flower.md
  target: ipad:tomas
  lines:
    - {id: "nx-pressed-flower.02.private.tomas~night4.vo-01", speaker: tomas, note: "thought", text: "The page says: 'the high room, the window I opened.' She's in the room where Ludmila fell."}
    - {id: "nx-pressed-flower.02.private.tomas~night4.vo-02", speaker: tomas-whisper, note: "thought, aside", text: "Lass, I hear you."}
