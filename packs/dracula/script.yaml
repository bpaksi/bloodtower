    - {id: "nx-pressed-flower.02.private.wren~night1.vo-02", speaker: wren-whisper, note: "thought, aside", text: "Got it."}
- id: "nx-pressed-flower.02.private.emeric~night1"
  source: nx-pressed-flower.md
  target: ipad:emeric
  lines:
    - {id: "nx-pressed-flower.02.private.emeric~night1.vo-01", speaker: emeric, note: "thought", text: "She's high up. Plastered walls, not stone. A lady's rooms."}
    - {id: "nx-pressed-flower.02.private.emeric~night1.vo-02", speaker: emeric-whisper, note: "thought, aside", text: "Noted, noted, I'm noting it."}
- id: "nx-pressed-flower.01~night2"
  source: nx-pressed-flower.md
  lines:
    - {id: "nx-pressed-flower.01~night2.vo-01", speaker: narrator, text: "A violet on the lintel at dusk, wrapped in a scrap of painted canvas."}
- id: "nx-pressed-flower.02.private.agnes~night2"
  source: nx-pressed-flower.md
  target: ipad:agnes
  lines:
    - {id: "nx-pressed-flower.02.private.agnes~night2.vo-01", speaker: agnes, note: "thought", text: "Painted canvas. She's being kept near pictures. A gallery."}
    - {id: "nx-pressed-flower.02.private.agnes~night2.vo-02", speaker: agnes-whisper, note: "thought, aside", text: "Child, I hear you."}
- id: "nx-pressed-flower.02.private.tomas~night2"
  source: nx-pressed-flower.md
  target: ipad:tomas
  lines:
    - {id: "nx-pressed-flower.02.private.tomas~night2.vo-01", speaker: tomas, note: "thought", text: "Painted canvas. She's being kept near pictures. A gallery."}
    - {id: "nx-pressed-flower.02.private.tomas~night2.vo-02", speaker: tomas-whisper, note: "thought, aside", text: "Lass, I hear you."}
- id: "nx-pressed-flower.02.private.wren~night2"
  source: nx-pressed-flower.md
  target: ipad:wren
  lines:
    - {id: "nx-pressed-flower.02.private.wren~night2.vo-01", speaker: wren, note: "thought", text: "Painted canvas. She's being kept near pictures. A gallery."}
    - {id: "nx-pressed-flower.02.private.wren~night2.vo-02", speaker: wren-whisper, note: "thought, aside", text: "Got it."}
- id: "nx-pressed-flower.02.private.emeric~night2"
  source: nx-pressed-flower.md
  target: ipad:emeric
  lines:
    - {id: "nx-pressed-flower.02.private.emeric~night2.vo-01", speaker: emeric, note: "thought", text: "Painted canvas. She's being kept near pictures. A gallery."}
    - {id: "nx-pressed-flower.02.private.emeric~night2.vo-02", speaker: emeric-whisper, note: "thought, aside", text: "Noted, noted, I'm noting it."}
- id: "nx-pressed-flower.01~night3"
  source: nx-pressed-flower.md
  lines:
    - {id: "nx-pressed-flower.01~night3.vo-01", speaker: narrator, text: "A violet in the dust, its stem tied with a single gold thread from a wedding veil."}
- id: "nx-pressed-flower.02.private.agnes~night3"
  source: nx-pressed-flower.md
  target: ipad:agnes
  lines:
    - {id: "nx-pressed-flower.02.private.agnes~night3.vo-01", speaker: agnes, note: "thought", text: "A veil. He's dressing her. Above the gallery, where the stair goes up."}
    - {id: "nx-pressed-flower.02.private.agnes~night3.vo-02", speaker: agnes-whisper, note: "thought, aside", text: "Child, I hear you."}
- id: "nx-pressed-flower.02.private.tomas~night3"
  source: nx-pressed-flower.md
  target: ipad:tomas
  lines:
    - {id: "nx-pressed-flower.02.private.tomas~night3.vo-01", speaker: tomas, note: "thought", text: "A veil. He's dressing her. Above the gallery, where the stair goes up."}
    - {id: "nx-pressed-flower.02.private.tomas~night3.vo-02", speaker: tomas-whisper, note: "thought, aside", text: "Lass, I hear you."}
- id: "nx-pressed-flower.02.private.wren~night3"
  source: nx-pressed-flower.md
  target: ipad:wren
  lines:
    - {id: "nx-pressed-flower.02.private.wren~night3.vo-01", speaker: wren, note: "thought", text: "A veil. He's dressing her. Above the gallery, where the stair goes up."}
    - {id: "nx-pressed-flower.02.private.wren~night3.vo-02", speaker: wren-whisper, note: "thought, aside", text: "Got it."}
