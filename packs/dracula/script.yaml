  lines:
    - {id: "nx-pressed-flower.02.private.wren~night4.vo-01", speaker: wren, note: "thought", text: "The page says: 'the high room, the window I opened.' She's in the room where Ludmila fell."}
    - {id: "nx-pressed-flower.02.private.wren~night4.vo-02", speaker: wren-whisper, note: "thought, aside", text: "Got it."}
- id: "nx-pressed-flower.02.private.emeric~night4"
  source: nx-pressed-flower.md
  target: ipad:emeric
  lines:
    - {id: "nx-pressed-flower.02.private.emeric~night4.vo-01", speaker: emeric, note: "thought", text: "The page says: 'the high room, the window I opened.' She's in the room where Ludmila fell."}
    - {id: "nx-pressed-flower.02.private.emeric~night4.vo-02", speaker: emeric-whisper, note: "thought, aside", text: "Noted, noted, I'm noting it."}
- id: "enc-early-lantern.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-early-lantern.01.vo-01", speaker: narrator, text: "It is not midnight. Nobody told the dead. One lantern comes up the lane alone, early, as if the mist had torn it off the line."}
- id: "enc-early-lantern.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-early-lantern.02.vo-01", speaker: narrator, text: "It stops in front of one of you. The rest of the procession will be one short tonight."}
- id: "enc-early-lantern.03"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-early-lantern.03.vo-01", speaker: narrator, text: "The ghost walks on, toward the castle, to wait for the others."}
- id: "enc-the-window.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-the-window.01.vo-01", speaker: narrator, text: "The mist parts on a window that is not in this valley, or is in it every night. A woman in white climbs onto the sill."}
- id: "enc-the-window.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-the-window.02.vo-01", speaker: count, note: "far off", text: "Ludmila. Not the window. Anything but the window."}
    - {id: "enc-the-window.02.vo-02", speaker: ludmila, note: "hushed", text: "Then do not come in."}
- id: "enc-the-window.03"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-the-window.03.vo-01", speaker: narrator, text: "Every night he asks. Every night she answers. Every night the mist makes the valley watch."}
- id: "enc-the-window.03~blocked"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-the-window.03~blocked.vo-01", speaker: narrator, text: "The grief reaches for one of you and finds no room left. It takes something from your packs instead."}
- id: "enc-the-window.04"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-the-window.04.vo-01", speaker: narrator, text: "She steps. The mist closes. Somewhere in that room, tonight, another girl is sitting by the same window."}
- id: "enc-brothers.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-brothers.01.vo-01", speaker: narrator, text: "Two men fight in the fog below the castle. Brothers, by the faces. The dark one takes the bright sword from the fair one, and uses it."}
- id: "enc-brothers.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-brothers.02.vo-01", speaker: count, note: "close, low", text: "I was only meant to take her. Not you. Never you."}
    - {id: "enc-brothers.02.vo-02", speaker: narrator, text: "He kneels in the road. The fog takes them both, and somewhere up the hill it starts again."}
- id: "enc-brothers.02~carrier"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-brothers.02~carrier.vo-01", speaker: count, note: "close, low", text: "I was only meant to take her. Not you. Never you."}
    - {id: "enc-brothers.02~carrier.vo-02", speaker: narrator, text: "At your back, wrapped in rotted crimson, the sword is warm as a hand. It knows that road."}
- id: "enc-brothers.03"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-brothers.03.vo-01", speaker: narrator, text: "A villager who stopped to watch does not come out of the fog. Drop a skull."}
- id: "enc-brothers.03~no-drop"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-brothers.03~no-drop.vo-01", speaker: narrator, text: "No one else stopped to watch tonight. The fog keeps its count for the castle."}
- id: "enc-at-the-door.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-at-the-door.01.vo-01", speaker: narrator, text: "Three knocks. The mist is coming under the door, but it stops at the sill, waiting to be asked."}
- id: "enc-at-the-door.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-at-the-door.02.vo-01", speaker: count, note: "through the door", text: "Only open it. I have asked so many doors tonight. One of them always opens, in the end."}
- id: "enc-at-the-door.03.private.agnes"
  source: tokens-and-encounters.md
  target: ipad:agnes
  lines:
    - {id: "enc-at-the-door.03.private.agnes.vo-01", speaker: count-whisper, text: "Sister. You prayed for me once. Pray with the door open."}
- id: "enc-at-the-door.03.private.tomas"
  source: tokens-and-encounters.md
  target: ipad:tomas
  lines:
    - {id: "enc-at-the-door.03.private.tomas.vo-01", speaker: count-whisper, text: "Varga. You still owe me two fingers' worth of gate duty."}
- id: "enc-at-the-door.03.private.wren"
  source: tokens-and-encounters.md
  target: ipad:wren
  lines:
    - {id: "enc-at-the-door.03.private.wren.vo-01", speaker: count-whisper, text: "Your mother sings for me now. Would you hear her? Open."}
- id: "enc-at-the-door.03.private.emeric"
  source: tokens-and-encounters.md
  target: ipad:emeric
  lines:
    - {id: "enc-at-the-door.03.private.emeric.vo-01", speaker: count-whisper, text: "Your master sold me a name through a door like this one. Ask me what he got for it."}
- id: "enc-at-the-door.04"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-at-the-door.04.vo-01", speaker: narrator, text: "The latch stops moving. The voice goes away up the hill, still polite. She refuses him every evening, he said. He said it as a complaint."}
- id: "enc-at-the-door.04~blocked"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-at-the-door.04~blocked.vo-01", speaker: narrator, text: "His breath finds the crack and nothing left to bite. The cold takes one thing from your packs instead, and the voice goes up the hill."}
- id: "enc-wrong-face.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wrong-face.01.vo-01", speaker: narrator, text: "A wall of mist rolls across the street and back. For one breath, one of you is gone. Then you are all there again."}
- id: "enc-wrong-face.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wrong-face.02.vo-01", speaker: narrator, text: "Count heads. Count them again. Lookalike moments follow, by mechanics, on one iPad only."}
- id: "enc-wrong-face.03"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wrong-face.03.vo-01", speaker: narrator, text: "Everyone is accounted for. That is what worries you."}
- id: "enc-mist-remembers.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-mist-remembers.01.vo-01", speaker: narrator, text: "The mist comes in close and stops being weather. It has seen where each of you has been. It shows you."}
- id: "enc-mist-remembers.02.private.agnes"
  source: tokens-and-encounters.md
  target: ipad:agnes
  lines:
    - {id: "enc-mist-remembers.02.private.agnes.vo-01", speaker: narrator, text: "Twelve infirmary beds in the fog, each one empty, each one still warm. The traveler's cot at the end has a pressed violet on the pillow. Face it, or walk through."}
- id: "enc-mist-remembers.02.private.tomas"
  source: tokens-and-encounters.md
  target: ipad:tomas
  lines:
    - {id: "enc-mist-remembers.02.private.tomas.vo-01", speaker: narrator, text: "The castle wall, the night you carried Marta over it. Your hand aches where the fingers were. Up on the wall, she is waving. Face it, or walk through."}
- id: "enc-mist-remembers.02.private.wren"
  source: tokens-and-encounters.md
  target: ipad:wren
  lines:
    - {id: "enc-mist-remembers.02.private.wren.vo-01", speaker: narrator, text: "Your father's yard. A stake in your hand, warm. A woman humming behind the church door, holding a baby. Face it, or walk through."}
- id: "enc-mist-remembers.02.private.emeric"
  source: tokens-and-encounters.md
  target: ipad:emeric
  lines:
    - {id: "enc-mist-remembers.02.private.emeric.vo-01", speaker: narrator, text: "Gerhardt's shop, every jar labelled in his hand. On the counter, a receipt: one name, sold. Face it, or walk through."}
- id: "enc-mist-remembers.03"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-mist-remembers.03.vo-01", speaker: narrator, text: "The fog lets go. Some of you look as if you saw something worth the price. Nobody says what."}
- id: "enc-road-returns.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-road-returns.01.vo-01", speaker: narrator, text: "The road out of the parish goes on for an hour. Then the milestone again. The shrine again. The same crow, on the same stone."}
- id: "enc-road-returns.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-road-returns.02.vo-01", speaker: narrator, text: "An empty cart stands by the shrine, its horse gone, the driver's coat folded on the seat. He tried the road too."}
- id: "enc-road-returns.03"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-road-returns.03.vo-01", speaker: narrator, text: "No one leaves Vellmoor while he holds it. The road, at least, is honest about that."}
- id: "enc-road-returns.03~drop"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-road-returns.03~drop.vo-01", speaker: narrator, text: "By morning the driver will be standing in the square with the others, very pale. Drop a skull."}
- id: "enc-ledger-page.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-ledger-page.01.vo-01", speaker: narrator, text: "A page of good paper comes along the road on its own and stops at your feet. Neat columns. A careful hand."}
- id: "enc-ledger-page.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-ledger-page.02.vo-01", speaker: jakob, note: "from the page", text: "Garden soil. Handle with care. Forty boxes, as last time. And the time before."}
    - {id: "enc-ledger-page.02.vo-02", speaker: emeric, text: "As last time. He has done this before. He's done all of this before."}
- id: "enc-ledger-page.02~no-emeric"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-ledger-page.02~no-emeric.vo-01", speaker: jakob, note: "from the page", text: "Garden soil. Handle with care. Forty boxes, as last time. And the time before."}
    - {id: "enc-ledger-page.02~no-emeric.vo-02", speaker: wren, text: "Last time. Somebody's been here doing this before us."}
- id: "enc-ledger-page.03"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-ledger-page.03.vo-01", speaker: narrator, text: "More pages lie up the road, one every few yards, toward somewhere dark."}
- id: "enc-wedding-uphill.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wedding-uphill.01.vo-01", speaker: narrator, text: "A wedding goes up the hill in the mist. Veiled girl in front, pale women behind. There is no groom. There never is."}
- id: "enc-wedding-uphill.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wedding-uphill.02.vo-01", speaker: narrator, text: "The veiled girl does not look back. The two at the end of the train do. They smile, and keep smiling."}
- id: "enc-wedding-uphill.03~won"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wedding-uphill.03~won.vo-01", speaker: narrator, text: "They come apart like wet paper. Where the veil trailed, a single gold thread lies in the road."}
- id: "enc-wedding-uphill.03~lost"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wedding-uphill.03~lost.vo-01", speaker: narrator, text: "The train closes over one of you, cold and sweet, and moves on up the hill. Someone in the village follows it. Drop a skull."}
- id: "enc-wine-for-no-one.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wine-for-no-one.01.vo-01", speaker: narrator, text: "The room is empty but for a table laid for one. A girl in castle livery pours the wine and stands back to wait."}
- id: "enc-wine-for-no-one.02"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wine-for-no-one.02.vo-01", speaker: marta, text: "Uncle? You shouldn't be here. He drinks at midnight, and he counts the glasses."}
    - {id: "enc-wine-for-no-one.02.vo-02", speaker: tomas, text: "I came back for you, lass. I always meant to."}
- id: "enc-wine-for-no-one.02~no-tomas"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wine-for-no-one.02~no-tomas.vo-01", speaker: marta, text: "You shouldn't be here. He drinks at midnight, and he counts the glasses."}
    - {id: "enc-wine-for-no-one.02~no-tomas.vo-02", speaker: agnes, text: "Who are you pouring for, child?"}
- id: "enc-wine-for-no-one.03"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-wine-for-no-one.03.vo-01", speaker: narrator, text: "When you look again there is only the table, and the glass, and the wine going dark."}
- id: "enc-third-hums.01"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-third-hums.01.vo-01", speaker: narrator, text: "Someone is humming in the fog. An old lullaby, the kind sung at a door to a baby left on the step."}
- id: "enc-third-hums.02.private.agnes"
  source: tokens-and-encounters.md
  target: ipad:agnes
  lines:
    - {id: "enc-third-hums.02.private.agnes.vo-01", speaker: agnes, note: "thought", text: "That is a mother's song. Whoever she was, part of her still is."}
- id: "enc-third-hums.02.private.tomas"
  source: tokens-and-encounters.md
  target: ipad:tomas
  lines:
    - {id: "enc-third-hums.02.private.tomas.vo-01", speaker: tomas, note: "thought", text: "I heard that on the castle stair, years back. The third one. She always sang."}
- id: "enc-third-hums.02.private.wren"
  source: tokens-and-encounters.md
  target: ipad:wren
  lines:
    - {id: "enc-third-hums.02.private.wren.vo-01", speaker: ilka, note: "far off", text: "Hush now, little bird. Mother's at the door. Mother's always at the door."}
- id: "enc-third-hums.02.private.emeric"
  source: tokens-and-encounters.md
  target: ipad:emeric
  lines:
    - {id: "enc-third-hums.02.private.emeric.vo-01", speaker: emeric, note: "thought", text: "Gerhardt wrote that his brides sing to the ones they lost. He said it like a footnote."}
- id: "enc-third-hums.03"
  source: tokens-and-encounters.md
  lines:
    - {id: "enc-third-hums.03.vo-01", speaker: narrator, text: "The song moves off toward the castle stair, where it has been going every night for nineteen years."}
