format: 2
kind: story
pack_id: test
title: Proving Grounds
version: 0.1.0
engine_min: 0.1.0
tagline: AREA-077 day slice — Enter and Leave only.
base_pack: base
playable: true
players: {min: 1, max: 4}

day:
  move_roll:
    dice: 2d4
    floor: 2
    modifiers: false

start:
  mode: one-per-kingdom-citadel
  assignments:
    - {hero: hero-a, kingdom: N}
    - {hero: hero-b, kingdom: E}
    - {hero: hero-c, kingdom: S}
    - {hero: hero-d, kingdom: W}

game:
  start:
    effects:
      - kind: set-flag
        flag: proving-grounds-open

chapters:
  - id: proving-grounds
    index: 1
    kingdoms: [N, E, S, W]
    timed_beats: []
    start:
      effects:
        - kind: narrate
          target: storyboard
          lines:
            - {speaker: narrator, text: "Walk the kingdoms. Enter a building or leave it. That is the whole of today."}
    end:
      when:
        type: flag
        flag: proving-grounds-open
      effects:
        - kind: narrate
          target: storyboard
          lines:
            - {speaker: narrator, text: "The sun sets on the Proving Grounds."}
    quests: []

assets:
  - {id: place.village, type: still, target: storyboard, status: final, path: assets/place-village.jpg}
  - {id: place.bazaar, type: still, target: storyboard, status: final, path: assets/place-bazaar.jpg}
  - {id: place.citadel, type: still, target: storyboard, status: final, path: assets/place-citadel.jpg}
  - {id: place.sanctuary, type: still, target: storyboard, status: final, path: assets/place-sanctuary.jpg}
