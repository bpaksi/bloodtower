format: 2
kind: story
pack_id: test
title: The Ruined Keep
cover: assets/cover.png
version: 0.1.0
engine_min: 0.1.0
tagline: "[COPY: The Ruined Keep tagline]"
base_pack: base
playable: true
players: {min: 1, max: 4}
settings:
  - id: party-size
    label: Party size
    options:
      - {id: n-1, label: "1"}
      - {id: n-2, label: "2"}
      - {id: n-3, label: "3"}
      - {id: n-4, label: "4"}
    default: n-4

day:
  move_roll:
    dice: 2d4
    floor: 2
    modifiers: false

start:
  mode: one-per-kingdom-citadel
  assignments:
    - {hero: hero-a, kingdom: N}
    - {hero: hero-b, kingdom: E}
    - {hero: hero-c, kingdom: S}
    - {hero: hero-d, kingdom: W}

setup:
  - id: place-heroes
    label: Stand each hero on their start building.

game:
  start:
    effects:
      - kind: set-flag
        flag: proving-grounds-open

chapters:
  - id: the-roads
    index: 1
    kingdoms: [N]
    timed_beats: []
    start:
      effects:
        - kind: narrate
          target: storyboard
          lines:
            - {speaker: narrator, text: "The roads out of Greyford are closed. Raiders have taken every cart for a month, and the lord's men are not coming."}
    end:
      when:
        type: flag
        flag: proving-grounds-open
      effects:
        - kind: narrate
          target: storyboard
          lines:
            - {speaker: narrator, text: "The roads are open. On the far hill, a fire burns in the old keep, where no one has lived for forty years."}
    quests:
      - {id: herald, scene: herald, place: {space: N-egans-end, type: village}}
      - {id: ambush, scene: ambush, place: {space: N-muted-forest, type: wild}}

  - id: the-keep
    index: 2
    kingdoms: [N, E]
    timed_beats: []
    start:
      effects:
        - kind: narrate
          target: storyboard
          lines:
            - {speaker: narrator, text: "[COPY: chapter 2 opens, Brynthia opens and the ruined keep is in view]"}
    quests:
      - {id: barrow, quest_type: tomb, place: {space: E-utars-barrows, type: wild}}
      - {id: shrine, scene: shrine, place: {space: E-greater-tombstones, type: village}}

  - id: the-tower
    index: 3
    kingdoms: [N, E, S, W]
    timed_beats: []
    start:
      effects:
        - kind: narrate
          target: storyboard
          lines:
            - {speaker: narrator, text: "[COPY: chapter 3 opens, the whole board and the road to the Tower]"}
    # The last choice is the plain scene `tower-end`; its flag picks the win line (DEC-664).
    end:
      effects:
        - kind: narrate
          target: storyboard
          lines:
            - {speaker: narrator, text: "The Warden falls. Beneath the keep lies the shard he swore to guard."}
            - {speaker: narrator, text: "Shatter it for good, or swear his oath and guard it in his place."}
    quests:
      - {id: lock, scene: lock, place: {space: S-howling-desert, type: wild}}
      - {id: last-stand, scene: last-stand, place: {space: W-the-grass-sea, type: wild}}

scenes:
  - id: herald
    options:
      - id: take-the-job
        label: "Take the job"
        effects:
          - {kind: item, item: tomas-map}
      - id: ask-pay-first
        label: "Ask for pay first"
        effects:
          - {kind: gold, amount: 10}
  # The toll is 10 gold; a short group pays all its gold plus 2 HP per present hero, never below
  # 1 HP, and the quest finishes (Q-C3-22). The engine owns that rule; the pack names the cost.
  - id: ambush
    options:
      - id: fight
        label: "Fight"
        effects:
          - {kind: battle}
      - id: pay-the-toll
        label: "Pay the toll (10 gold)"
        cost: {kind: toll}
        effects:
          - {kind: flag, flag: ambush-toll-paid}
  - id: shrine
    options:
      - id: pray-at-the-altar
        label: "Pray at the altar"
        effects:
          - {kind: item, item: oath-blade}
      - id: leave-the-shrine
        label: "[COPY: Leave the shrine]"
        effects:
          - {kind: flag, flag: shrine-left}
  - id: lock
    options:
      - id: turn-the-signet
        label: "Turn the Signet"
        needs_item: signet
        effects:
          - {kind: flag, flag: lock-opened}
      - id: force-it
        label: "Force it"
        effects:
          - {kind: battle}
  # The foe is the random level-3 foe the engine draws (DEC-647); a battle effect names none.
  - id: last-stand
    options:
      - id: hold-the-gate
        label: "Hold the line"
        effects:
          - {kind: battle}
      - id: rally-the-guard
        label: "[COPY: Rally the guard]"
        effects:
          - {kind: flag, flag: last-stand-rallied}
  - id: tower-end
    options:
      - id: break-the-seal
        label: "Shatter the shard"
        effects:
          - {kind: flag, flag: ending-break}
      - id: swear-the-oath
        label: "Swear the oath"
        effects:
          - {kind: flag, flag: ending-oath}

items:
  - id: tomas-map
    label: "[COPY: Tomas's Map]"
    from: {quest: herald, option: take-the-job}
  - id: signet
    label: "[COPY: The Warden's Signet]"
    from: {quest: barrow}
  - id: oath-blade
    label: "[COPY: The Warden's oath-blade]"
    from: {quest: shrine, option: pray-at-the-altar}

endings:
  win:
    - id: win-break
      when: {type: flag, flag: ending-break}
      text: "The shard shatters. The Tower's call goes quiet, and the roads are yours."
    - id: win-oath
      when: {type: flag, flag: ending-oath}
      text: "You swear his oath and take up his watch. The Tower called to him once. It will call to you."
  loss:
    - {way: corruption, text: "One of you hears the Tower call, and goes to it. Without them, the hunt is over."}
    - {way: skulls, text: "The last skull falls. The Tower's shadow covers the land, and the roads are his for good."}
    - {way: buildings, text: "Four strongholds have fallen. There is nowhere left to hold, and his raiders own the land."}

assets:
  - {id: place.village, type: still, target: storyboard, status: draft, path: assets/place-village.jpg}
  - {id: place.bazaar, type: still, target: storyboard, status: draft, path: assets/place-bazaar.jpg}
  - {id: place.citadel, type: still, target: storyboard, status: draft, path: assets/place-citadel.jpg}
  - {id: place.sanctuary, type: still, target: storyboard, status: draft, path: assets/place-sanctuary.jpg}
  # Story paintings, group 1 (inventory §3 issue 2): AI drafts, 2026-11-26, 1920x1080; Bob ticks finals in approval.md.
  - {id: painting.ch1-the-roads, type: still, target: storyboard, status: draft, path: assets/painting.ch1-the-roads.webp}
  - {id: painting.ch2-the-keep, type: still, target: storyboard, status: draft, path: assets/painting.ch2-the-keep.webp}
  - {id: painting.ch3-the-tower, type: still, target: storyboard, status: draft, path: assets/painting.ch3-the-tower.webp}
  - {id: painting.keep-sealed-door, type: still, target: storyboard, status: draft, path: assets/painting.keep-sealed-door.webp}
  - {id: painting.finale-win, type: still, target: storyboard, status: draft, path: assets/painting.finale-win.webp}
  - {id: painting.finale-loss, type: still, target: storyboard, status: draft, path: assets/painting.finale-loss.webp}
  # Demo line (A1 step 8b-1, D48). Provenance: checklist id vo.loremaster.seal-break-1 -> this id.
  # Voice is provisional (Charon). No file yet: it stays unavailable (caption only) until packed.
  - {id: "seal-break.01~vo-01", type: line, target: storyboard, status: placeholder, speaker: narrator, text: "The roads are clear, and a seal breaks like an old oath giving way. Ahead stands the Ruined Keep."}
  # The other C5-05 Loremaster lines (C5-05-ruined-keep-art.md §6.3, §6.4), text from
  # research/stories/ruined-keep/script.md (accepted 2026-11-06). No files yet: caption only until packed.
  - {id: "chapter-card.01~vo-01", type: line, target: storyboard, status: placeholder, speaker: narrator, text: "Hear the herald in Greyford. Then open the forest road."}
  - {id: "chapter-card.02~vo-01", type: line, target: storyboard, status: placeholder, speaker: narrator, text: "Go down into the barrow under the old keep. Find the shrine on the road beside it."}
  - {id: "chapter-card.03~vo-01", type: line, target: storyboard, status: placeholder, speaker: narrator, text: "Open the sealed gate on the Tower road. Break his guard on the Grass Sea. Then climb."}
  - {id: "chapter-win.01~vo-01", type: line, target: storyboard, status: placeholder, speaker: narrator, text: "The roads are open. On the far hill, a fire burns in the old keep, where no one has lived for forty years."}
  - {id: "chapter-win.03~vo-01", type: line, target: storyboard, status: placeholder, speaker: narrator, text: "The gate is open and the last stand held. The Warden's door is open, for now."}
  - {id: "seal-break.02~vo-01", type: line, target: storyboard, status: placeholder, speaker: narrator, text: "The Keep gives up its dead, and a second seal cracks. The Tower waits."}
  - {id: "seal-break.03~vo-01", type: line, target: storyboard, status: placeholder, speaker: narrator, text: "The last stand holds, and the third seal breaks. Only the Warden remains."}
  - {id: "finale-win.shattered~vo-01", type: line, target: storyboard, status: placeholder, speaker: narrator, text: "The shard shatters. The Tower's call goes quiet, and the roads are yours."}
  - {id: "finale-win.oath~vo-01", type: line, target: storyboard, status: placeholder, speaker: narrator, text: "You swear his oath and take up his watch. The Tower called to him once. It will call to you."}
  - {id: "finale-loss.skulls~vo-01", type: line, target: storyboard, status: placeholder, speaker: narrator, text: "The last skull falls. The Tower's shadow covers the land, and the roads are his for good."}
  - {id: "finale-loss.corruption~vo-01", type: line, target: storyboard, status: placeholder, speaker: narrator, text: "One of you hears the Tower call, and goes to it. Without them, the hunt is over."}
  - {id: "finale-loss.fallen-buildings~vo-01", type: line, target: storyboard, status: placeholder, speaker: narrator, text: "Four strongholds have fallen. There is nowhere left to hold, and his raiders own the land."}
