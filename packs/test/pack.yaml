pack_id: test
title: Proving ground
version: 0.1.0
engine_min: 0.1.0
tagline: A long-lived proving ground for new ideas.
tone: A long-lived proving ground for new ideas.
cover: assets/cover.png
tower: optional
settings:
  - id: length
    label: Length
    options:
      - {id: short, label: Short}
      - {id: standard, label: Standard}
      - {id: long, label: Long}
    default: standard
  - id: difficulty
    label: Difficulty
    options:
      - {id: standard, label: Standard}
    default: standard
structure: one-shot
players: {min: 1, max: 4}
lengths: [short, standard, long]
difficulties:
  - {id: standard, label: Standard, mods: {}}
systems: {clock: nights, corruption: false}
components:
  - {asset-group: stills, use: used}
# Physical setup steps, one board dialog each with Done and Back on the devices (R-WIZ-5, R-WIZ-6).
# Claim Hunters and Connect Tower are engine screens, not listed here.
setup:
  - id: lay-out-board
    label: Lay out the board and orient the kingdoms.
    illustration: ill.setup-board
  - id: place-hunters
    label: Stand each hunter's figure on the hall's start building.
  - id: ready-decks
    label: Shuffle the decks and set the tokens beside the board.
av_theme:
  art_style: plain
  clip_style: none
  palette: ink
  narrator_voice: narrator
  music_mood: quiet
  sfx_set: basic
ambient:
  night: {bed: amb.night, accents: [acc.tick], interval_s: [20, 60]}
cast:
  - {id: narrator, name: Narrator, voice: vo.narrator, role: narrator}
  - {id: keeper, name: The Keeper, voice: vo.keeper, role: npc}
