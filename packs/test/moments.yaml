- id: proving-ground.01
  kind: still
  target: storyboard
  asset: fx.hall
  lines:
    - {speaker: narrator, text: "The proving ground is quiet.", voice: vo.line}
- id: proving-ground.01~no-delta
  kind: still
  target: storyboard
  asset: fx.hall
  cond: absent(delta)
  lines:
    - {speaker: narrator, text: "Delta is not in the hall.", voice: vo.line}
- id: proving-ground.02.private.alpha
  kind: text-card
  target: ipad:alpha
  placeholder: "Each hunter reads alone."
  lines:
    - {speaker: alpha, text: "Only Alpha hears this.", voice: vo.alpha-line}
- id: proving-ground.02.private.delta
  kind: text-card
  target: ipad:delta
  placeholder: "Each hunter reads alone."
  lines:
    - {speaker: delta, text: "Only Delta hears this.", voice: vo.delta-line}
- id: proving-ground.03
  kind: text-card
  target: storyboard
  lines:
    - {speaker: narrator, text: "A bell marks the step.", voice: vo.line}
  cues:
    - {cue: bell, at: start}
- id: grey-stair.01
  kind: still
  target: storyboard
  asset: fx.stair
  advance: next
  lines:
    - {speaker: narrator, text: "A grey stair climbs into the dark. [pause 1] Someone has left the lamps unlit.", voice: vo.line}
- id: grey-stair.02
  kind: still
  target: storyboard
  asset: fx.stair
  advance: next
  lines:
    - {speaker: narrator, text: "At the top, a door. Below it, a draught from the crypt.", voice: vo.line}
    - {speaker: delta, text: "I hear water down there.", voice: vo.delta-line}
- id: grey-stair.02~no-delta
  kind: still
  target: storyboard
  asset: fx.stair
  cond: absent(delta)
  advance: next
  lines:
    - {speaker: narrator, text: "At the top, a door. Below it, a draught from the crypt.", voice: vo.line}
- id: grey-stair.02.private.alpha
  kind: text-card
  target: ipad:alpha
  placeholder: "Each hunter has a private thought."
  advance: next
  lines:
    - {speaker: alpha, text: "Your oil flask is half full.", voice: vo.alpha-line}
- id: grey-stair.02.private.beta
  kind: text-card
  target: ipad:beta
  placeholder: "Each hunter has a private thought."
  advance: next
  lines:
    - {speaker: beta, text: "The hinge is dry. It will scream if we shove it.", voice: vo.beta}
- id: grey-stair.02.private.gamma
  kind: text-card
  target: ipad:gamma
  placeholder: "Each hunter has a private thought."
  advance: next
  lines:
    - {speaker: gamma, text: "The draught smells of wet stone, not of air.", voice: vo.gamma}
- id: grey-stair.02.private.delta
  kind: text-card
  target: ipad:delta
  placeholder: "Each hunter has a private thought."
  advance: next
  lines:
    - {speaker: delta, text: "You count the steps. The third is worn.", voice: vo.delta-line}
- id: grey-stair.03
  kind: clip
  target: storyboard
  asset: av.keeper
  advance: clip-end
- id: grey-stair.door-choice
  kind: pick-card
  target: ipad:all
  placeholder: "Oil the hinge, or force it."
  advance: step
- id: grey-stair.04
  kind: still
  target: storyboard
  asset: fx.stair
  advance: next
  lines:
    - {speaker: narrator, text: "The lamps are lit, or they are not. The stair is quiet.", voice: vo.line}
