<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board map entry</title>
<style>
  :root { --ink: #1d1b18; --muted: #6d675e; --line: #d8d2c6; --paper: #faf8f3; --accent: #7a4a1e; --bad: #9b2c2c; --good: #2d6a3e; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ece7dc; --muted: #a39c8f; --line: #3a372f; --paper: #1c1a16; --accent: #d9a46a; --bad: #e07a7a; --good: #7fc796; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); background: var(--paper); display: grid; grid-template-columns: 260px 1fr 280px; height: 100vh; }
  aside, main, section { overflow: auto; padding: 14px; }
  aside { border-right: 1px solid var(--line); }
  section { border-left: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0 0 10px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
  button { font: inherit; padding: 4px 9px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 4px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  input, select { font: inherit; padding: 3px 5px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 4px; }
  .space { display: flex; justify-content: space-between; gap: 6px; padding: 3px 6px; border-radius: 4px; cursor: pointer; }
  .space.sel { background: var(--line); }
  .space .reg { color: var(--muted); font-size: 12px; }
  .cross { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 480px; margin: 8px 0; }
  .cell { border: 1px dashed var(--line); border-radius: 6px; padding: 8px; min-height: 58px; cursor: pointer; font-size: 13px; }
  .cell.filled { border-style: solid; }
  .cell.center { background: var(--line); cursor: default; font-weight: 600; text-align: center; }
  .cell small { color: var(--muted); display: block; }
  .list li { margin: 2px 0; }
  .error { color: var(--bad); }
  .ok { color: var(--good); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .muted { color: var(--muted); }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; height: auto; } aside, section { border: 0; } }
</style>
</head>
<body>
<aside>
  <h1>Spaces</h1>
  <div id="spaces"></div>
</aside>
<main>
  <div id="detail"><p class="muted">Pick a space on the left.</p></div>
</main>
<section>
  <h1>Regions</h1>
  <div class="row"><input id="newRegion" placeholder="New region name"><button type="button" id="addRegion">Add</button></div>
  <ul id="regions" class="list"></ul>
  <h2>Checks</h2>
  <div id="checks"></div>
  <div class="row"><button type="button" id="export" class="primary">Export to base pack</button></div>
  <p id="message" class="muted"></p>
</section>
<script src="app.js" type="module"></script>
</body>
</html>
