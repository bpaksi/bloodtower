<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board map entry</title>
<style>
  :root {
    --ink: #1d1b18; --muted: #6d675e; --line: #e2dccf; --paper: #f5f2ea; --panel: #ffffff;
    --accent: #7a4a1e; --accent-soft: #f3e7d6; --bad: #9b2c2c; --good: #2d6a3e; --open: #f4f0e6; --drop: #f2d6a2;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #ece7dc; --muted: #a39c8f; --line: #3d3a32; --paper: #17150f; --panel: #211e17; --accent: #d9a46a;
      --accent-soft: #3a2f20; --bad: #e88a8a; --good: #8fd1a2; --open: #2a271f; --drop: #5a4424;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  header { display: flex; align-items: center; gap: 20px; padding: 16px 28px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; box-shadow: var(--shadow); }
  header h1 { font-size: 20px; margin: 0; margin-right: auto; }
  .columns { display: grid; grid-template-columns: 400px 1fr; height: calc(100vh - 70px); }
  .toolbar { overflow: auto; padding: 22px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 22px; }
  .area { overflow: auto; padding: 0 40px 32px; }
  /* The space's name and its complete button stay at the top while the rest scrolls. */
  .detail-head { position: sticky; top: 0; z-index: 1; background: var(--paper); border-bottom: 1px solid var(--line); padding: 22px 0 16px; margin-bottom: 22px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .detail-head .title { margin-right: auto; }
  .detail-head h1 { font-size: 24px; margin: 0; }
  .detail-head p { margin: 2px 0 0; }
  .wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; box-shadow: var(--shadow); }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 14px; }
  h1.space-name { font-size: 28px; margin: 0; }
  button { font: inherit; padding: 10px 18px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  input, select { font: inherit; padding: 10px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; width: 100%; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  label { display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  /* Toolbar sections take the height they need; only the toolbar itself scrolls. */
  .space-list { margin-top: 12px; }
  .space-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
  .space-row:hover { background: var(--open); }
  .space-row.sel { background: var(--accent-soft); }
  .space-group { margin-top: 14px; }
  .space-group h3 { font-size: 13px; color: var(--muted); letter-spacing: .04em; margin: 0 0 6px; text-transform: uppercase; }
  .tag { color: var(--muted); font-size: 14px; }
  .meter { height: 8px; background: var(--open); border-radius: 999px; overflow: hidden; margin: 6px 0 12px; }
  .meter span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .stat { display: flex; justify-content: space-between; font-size: 15px; margin: 4px 0; }
  .cross { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .cell { min-height: 118px; border: 2px dashed var(--line); border-radius: 14px; padding: 14px; background: var(--open); display: flex; flex-direction: column; gap: 6px; justify-content: center; }
  .cell.open { color: var(--muted); }
  .cell.drop { background: var(--drop); border-color: var(--accent); }
  .cell.filled { background: var(--panel); border-style: solid; border-color: var(--accent); cursor: grab; box-shadow: var(--shadow); }
  .cell.center { background: transparent; border-style: solid; border-color: var(--line); text-align: center; align-items: center; }
  .cell .slot { font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  .cell .name { font-size: 17px; font-weight: 600; }
  .chip { display: inline-flex; gap: 8px; align-items: center; padding: 9px 16px; border-radius: 999px; background: var(--panel); border: 1px solid var(--accent); cursor: grab; }
  .chip.unsure { border-style: dashed; }
  .tray { min-height: 84px; border: 2px dashed var(--line); border-radius: 14px; padding: 14px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; background: var(--open); }
  .tray.drop { background: var(--drop); border-color: var(--accent); }
  .badge { font-size: 13px; color: var(--muted); }
  .picker { position: relative; }
  .results { position: static; margin-top: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .results div { padding: 12px 16px; cursor: pointer; }
  .results div.hi, .results div:hover { background: var(--open); }
  .results .none { color: var(--muted); cursor: default; }
  .editor { border: 1px solid var(--accent); }
  .error { color: var(--bad); }
  .ok { color: var(--good); font-weight: 600; }
  .muted { color: var(--muted); }
  ul.list { margin: 0; padding-left: 20px; }
  ul.list li { margin: 8px 0; }
  #message { min-height: 1.4em; }
  .divider { flex-basis: 100%; font-size: 13px; color: var(--muted); letter-spacing: .04em; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
  .chip.object { border-style: dashed; }
  .cell.object { border-color: var(--good); }
  @media (max-width: 1000px) { .columns { grid-template-columns: 1fr; height: auto; } .toolbar, .area { overflow: visible; } .detail-head { top: 72px; } }
</style>
</head>
<body>
<header>
  <h1>Board map entry</h1>
  <span id="message" class="muted"></span>
</header>
<div class="columns">
  <aside class="toolbar">
    <section class="card" id="addNeighbour"></section>
    <section class="card" id="progress"></section>
    <section class="card">
      <p class="section-title">Spaces</p>
      <input id="spaceFilter" placeholder="Find a space by name" autocomplete="off">
      <div id="spaces" class="space-list"></div>
    </section>
    <section class="card">
      <p class="section-title">Regions</p>
      <input id="newRegion" placeholder="Type a region name and press Enter">
      <ul id="regions" class="list"></ul>
    </section>
    <section class="card">
      <p class="section-title">Checks</p>
      <div id="checks"></div>
    </section>
  </aside>
  <main class="area" id="detail"><p class="muted">Pick a space on the left.</p></main>
</div>
<script src="app.js" type="module"></script>
</body>
</html>
