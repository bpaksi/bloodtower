<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board map entry</title>
<style>
  :root {
    --ink: #1d1b18; --muted: #6d675e; --line: #d8d2c6; --paper: #faf8f3; --panel: #ffffff;
    --accent: #7a4a1e; --bad: #9b2c2c; --good: #2d6a3e; --open: #f1ecdf; --drop: #f4d9a8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #ece7dc; --muted: #a39c8f; --line: #3d3a32; --paper: #1c1a16; --panel: #242119;
      --accent: #d9a46a; --bad: #e88a8a; --good: #8fd1a2; --open: #2a271f; --drop: #5a4424; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.45 system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  header { display: flex; align-items: center; gap: 20px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 20px; margin: 0; margin-right: auto; }
  .columns { display: grid; grid-template-columns: 380px 1fr; gap: 0; height: calc(100vh - 70px); }
  .column { overflow: auto; padding: 22px 24px; }
  .column + .column { border-left: 1px solid var(--line); }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 12px; }
  h2:first-child { margin-top: 0; }
  button { font: inherit; padding: 9px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  input, select { font: inherit; padding: 9px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; }
  label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .space-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; }
  .space-row:hover { background: var(--open); }
  .space-row.sel { background: var(--open); outline: 2px solid var(--accent); }
  .tag { color: var(--muted); font-size: 14px; }
  .cross { display: grid; grid-template-columns: repeat(3, minmax(130px, 1fr)); gap: 14px; margin: 14px 0 24px; max-width: 620px; }
  .cell { min-height: 112px; border: 2px dashed var(--line); border-radius: 12px; padding: 12px; background: var(--open); display: flex; flex-direction: column; gap: 6px; justify-content: center; }
  .cell.open { color: var(--muted); }
  .cell.drop { background: var(--drop); border-color: var(--accent); }
  .cell.filled { background: var(--panel); border-style: solid; border-color: var(--accent); cursor: grab; }
  .cell.center { background: transparent; border-style: solid; border-color: var(--line); text-align: center; font-weight: 600; cursor: default; align-items: center; }
  .cell .slot { font-size: 13px; color: var(--muted); letter-spacing: .05em; }
  .cell .name { font-size: 17px; font-weight: 600; }
  .chip { display: inline-flex; gap: 8px; align-items: center; padding: 8px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--accent); cursor: grab; }
  .chip.unsure { border-style: dashed; }
  .tray { min-height: 76px; border: 2px dashed var(--line); border-radius: 12px; padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .tray.drop { background: var(--drop); border-color: var(--accent); }
  .badge { font-size: 13px; color: var(--muted); }
  .picker { position: relative; max-width: 520px; }
  .picker input { width: 100%; }
  .results { position: absolute; left: 0; right: 0; top: 100%; margin-top: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; max-height: 330px; overflow: auto; z-index: 3; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  .results div { padding: 10px 14px; cursor: pointer; }
  .results div.hi, .results div:hover { background: var(--open); }
  .results .none { color: var(--muted); cursor: default; }
  .editor { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: var(--panel); max-width: 620px; }
  .error { color: var(--bad); }
  .ok { color: var(--good); font-weight: 600; }
  .muted { color: var(--muted); }
  .list li { margin: 8px 0; }
  #message { min-height: 1.4em; }
  .toolbar input { width: 100%; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <h1>Board map entry</h1>
  <span id="message" class="muted"></span>
  <button type="button" id="export" class="primary">Export to base pack</button>
</header>
<div class="columns">
  <div class="column toolbar">
    <h2>Spaces</h2>
    <input id="spaceFilter" placeholder="Find a space (type part of a name)" autocomplete="off">
    <div id="spaces"></div>
    <h2>Regions</h2>
    <input id="newRegion" placeholder="Type a region name and press Enter">
    <ul id="regions" class="list"></ul>
    <h2>Checks</h2>
    <div id="checks"></div>
  </div>
  <div class="column" id="detail"><p class="muted">Pick a space on the left.</p></div>
</div>
<script src="app.js" type="module"></script>
</body>
</html>
